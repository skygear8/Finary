<title>Socle</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout : app mobile d'abord, en-tête de patrimoine net, onglets fixés en bas, fiches en feuille glissante. */
:root {
  --bg: #f7f6fa; --surface: #ffffff; --sunk: #efedf5; --fg: #1b1828; --muted: #6e6a80; --line: #e7e4ee;

  --gain: #1d7a55; --loss: #b5452a;
  --c-liq: #9aa59f; --c-bourse: #5b3fb0; --c-av: #5d7fa3; --c-crypto: #c98a3c; --c-immo: #b6956a; --c-sci: #8a6a45; --c-es: #a3627e; --c-autre: #c4c9c3;
  --font-display: "Fraunces", ui-serif, Georgia, serif;
  --font-body: "Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #100e17; --surface: #18151f; --sunk: #211d2b; --fg: #ece9f4; --muted: #9d97ad; --line: #2a2536;
    --accent: #b9a4f5; --accent-ink: #150f24; --gold: #d9a866; --gold-hi: #e8c08a;
    --hero: radial-gradient(120% 90% at 100% 0%, #2a2142 0%, transparent 60%), #18151f;
    --shadow: none; --panel-border: #29243a; --gain: #6fd4a3; --loss: #f0906e;
    --c-liq: #8f9b95; --c-bourse: #b9a4f5; --c-av: #94b4d8; --c-crypto: #e0a65c; --c-immo: #d2b48a; --c-sci: #b8946a; --c-es: #d295b0; --c-autre: #4f5b55;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #100e17; --surface: #18151f; --sunk: #211d2b; --fg: #ece9f4; --muted: #9d97ad; --line: #2a2536;
    --accent: #b9a4f5; --accent-ink: #150f24; --gold: #d9a866; --gold-hi: #e8c08a;
    --hero: radial-gradient(120% 90% at 100% 0%, #2a2142 0%, transparent 60%), #18151f;
    --shadow: none; --panel-border: #29243a; --gain: #6fd4a3; --loss: #f0906e;
    --c-liq: #8f9b95; --c-bourse: #b9a4f5; --c-av: #94b4d8; --c-crypto: #e0a65c; --c-immo: #d2b48a; --c-sci: #b8946a; --c-es: #d295b0; --c-autre: #4f5b55;
    color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  font-variant-numeric: tabular-nums;
}
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(92px + env(safe-area-inset-bottom, 0px));
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 15px; font-weight: 600; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand b { font-family: var(--font-display); font-size: 17px; display: flex; align-items: center; gap: 8px; }

.status { font-size: 12px; color: var(--muted); }
.hero { padding-block: 22px 18px; display: grid; gap: 4px; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.big { font-family: var(--font-display); font-size: clamp(34px, 9vw, 46px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }

.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; min-width: 0; }

.tile .s { font-size: 12px; color: var(--muted); }
.section { margin-top: 22px; display: grid; gap: 10px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.section-head .total { font-weight: 600; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.alloc { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 16px; align-items: center; }

.legend { display: grid; gap: 8px; width: 100%; font-size: 14px; }

.list { display: grid; }
.row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center;
  padding: 11px 2px; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0;

.row .amt small { display: block; font-weight: 500; font-size: 12px; }
.gain { color: var(--gain); } .loss { color: var(--loss); }
.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 99px; background: var(--sunk); color: var(--muted); }
.btn {
  appearance: none; border: 0; border-radius: 11px; padding: 11px 16px; font: 600 14px var(--font-body);
  background: var(--accent); color: var(--accent-ink); cursor: pointer;
}
.btn.ghost { background: var(--sunk); color: var(--fg); }
.btn.danger { background: transparent; color: var(--loss); border: 1px solid currentColor; }
.btn:focus-visible, .row:focus-visible, .tab:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.add { width: 100%; }
.empty { text-align: center; color: var(--muted); padding: 22px 8px; font-size: 14px; }
.empty .btn { margin-top: 12px; }
.note { font-size: 12px; color: var(--muted); }
.bar { height: 6px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.kv { display: grid; }
.kv div { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: 14px; }
.kv div span:first-child { color: var(--muted); }
.kv .strong { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 9px; font-weight: 600; }
.kv .strong span:first-child { color: var(--fg); }
svg text { fill: var(--muted); font-family: var(--font-body); font-size: 10px; }

/* Onglets fixés en bas */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tabs nav { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); }
.tab { appearance: none; background: none; border: 0; color: var(--muted); font: 500 12px var(--font-body); padding: 10px 4px 9px; display: grid; justify-items: center; gap: 3px; cursor: pointer; }
.tab svg { width: 22px; height: 22px; }

/* Feuille (formulaires et fiches) */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / 0.35); z-index: 30; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-height: 92%; overflow-y: auto;
  background: var(--bg); border-radius: 20px 20px 0 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px calc(20px + env(safe-area-inset-bottom, 0px));
}
@media (min-width: 800px) { .sheet { left: 50%; width: 720px; transform: translateX(-50%); } }
.grab { width: 38px; height: 5px; border-radius: 99px; background: var(--line); margin: 0 auto 12px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.sheet-head h2 { font-size: 19px; }
.x { appearance: none; border: 0; background: var(--sunk); color: var(--fg); width: 32px; height: 32px; border-radius: 99px; font-size: 18px; cursor: pointer; flex: none; }
form.f { display: grid; gap: 14px; }
fieldset { border: 0; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
legend { grid-column: 1 / -1; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 0; margin-bottom: 8px; }

  border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px; min-width: 0;
}
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions .btn { flex: 1 1 140px; }
.err { color: var(--loss); font-size: 13px; }
.upd { display: grid; grid-template-columns: minmax(0, 1fr) 130px; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.upd:first-of-type { border-top: 0; }

.upd input { text-align: right; }
.upd input.changed { border-color: var(--accent); }
.seg { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; margin-inline: -2px; }
.seg::-webkit-scrollbar { display: none; }
.seg-b { appearance: none; flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 99px; padding: 7px 13px; font: 500 14px var(--font-body); cursor: pointer; }
.seg-b span { color: var(--muted); font-size: 12px; }

.seg-b[aria-selected="true"] span { color: inherit; opacity: 0.7; }

.head-btns { display: flex; gap: 8px; align-items: center; flex: none; }
.btn.sm { padding: 7px 12px; font-size: 13px; }
.todo { background: var(--surface); border: 1px dashed var(--accent); border-radius: var(--r); padding: 12px 14px; margin-bottom: 12px; display: grid; gap: 8px; font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.monthly { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.banner { background: var(--sunk); border-radius: 12px; padding: 10px 12px; font-size: 13px; color: var(--muted); margin-top: 12px; }

/* ---- Habillage 2 : cartes douces, en-tête en dégradé, analyses repliables ---- */
.panel, .tile { border-color: var(--panel-border); box-shadow: var(--shadow); }
.tile { padding: 14px 15px; }
.tile .v { font-size: 20px; letter-spacing: -0.02em; }
.hero { position: relative; overflow: hidden; margin-top: 14px; padding: 22px 20px 0; border-radius: 24px; background: var(--hero); color: #fff; box-shadow: 0 18px 40px -22px rgb(15 35 90 / 0.75); }
.hero::after { content: ""; position: absolute; right: -60px; top: -80px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(closest-side, rgb(233 196 106 / 0.22), transparent); pointer-events: none; }
.hero .eyebrow, .hero .sub { color: rgb(255 255 255 / 0.78); }
.hero .big { color: #fff; }
.hero .sub { padding-bottom: 20px; }
.hero .sub .gain, .hero .sub .loss { color: #fff; }
.hero:has(.spark) .sub { padding-bottom: 6px; }
.chip-d { display: inline-block; padding: 2px 9px; border-radius: 99px; background: rgb(233 196 106 / 0.18); color: var(--gold-hi) !important; font-weight: 600; margin-right: 4px; }
.hero .eyebrow { color: var(--gold-hi); }
.hero::before { content: ""; position: absolute; left: 20px; right: 20px; top: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--gold-hi), transparent); opacity: 0.7; }
.bar > i { background: linear-gradient(90deg, var(--accent), var(--gold)); }
.tab[aria-current="page"] svg { color: var(--gold); }
.spark { display: block; width: calc(100% + 40px); height: 56px; margin: 4px -20px 0; }
.section { margin-top: 26px; }
h2 { font-size: 16px; }
.h-lg { font-size: 19px; }
.row { padding: 13px 2px; }
.row.with-av { grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; }
.av { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; font: 600 15px var(--font-display); color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
.row .amt small.gain, .row .amt small.loss { font-weight: 600; }
.legend div { padding: 2px 0; }
.dot { border-radius: 99px; }
details.fold { background: var(--surface); border: 1px solid var(--panel-border); border-radius: var(--r); box-shadow: var(--shadow); padding: 0 14px; margin-top: 12px; gap: 10px; }

.cal { margin: 2px 0 8px; }

.txl:has(.cal-day.ev) { grid-template-columns: 42px minmax(0, 1fr); }
.warn { color: #c46a12; font-weight: 600; }
ol.tips { margin: 0; padding: 0 0 0 20px; display: grid; gap: 10px; line-height: 1.45; }
.mbars { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; height: 90px; align-items: end; }

.mbars i { display: block; width: 100%; max-width: 18px; min-height: 2px; border-radius: 4px 4px 0 0; background: linear-gradient(180deg, var(--gold), var(--accent)); }
.mbars small { font-size: 10px; color: var(--muted); }
.kv .alert { background: color-mix(in srgb, var(--loss) 10%, transparent); border-radius: 8px; padding: 8px 10px; }
.env, .env-cta { display: grid; gap: 8px; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--panel-border); }
.env .gh { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.env .bar, .goal .bar { display: block; }
.inl { width: 110px; text-align: right; font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--panel-border); background: var(--surface); color: var(--fg); }
input.search { width: 100%; box-sizing: border-box; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--panel-border); background: var(--surface); color: var(--fg); margin-bottom: 8px; }
.report-txt { width: 100%; min-height: 140px; box-sizing: border-box; font: 13px/1.4 var(--font-body); margin-top: 8px; padding: 8px; border-radius: 8px; border: 1px solid var(--panel-border); background: var(--surface); color: var(--fg); }
.cal-h, .cal-g { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }

.cal-d { min-height: 46px; border-radius: 8px; background: color-mix(in srgb, var(--muted) 7%, transparent); padding: 4px 3px; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 11px; min-width: 0; }
.cal-d.empty { background: none; }
.cal-d i { font-style: normal; color: var(--muted); }
.cal-d.has { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.cal-d.has.paid { background: color-mix(in srgb, var(--gain) 13%, transparent); }
button.cal-d { border: 0; font: inherit; color: inherit; cursor: pointer; }
.cal-d.sel { outline: 2px solid var(--accent); background: color-mix(in srgb, var(--accent) 26%, transparent); }
.cal-bar { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }

.cal-d.today { outline: 1.5px solid var(--accent); }
.cal-d b { font-size: 10.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.cal-dots { display: flex; gap: 2px; } .cal-dots em { width: 5px; height: 5px; border-radius: 50%; }
.cal-day { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-size: 12px; font-weight: 600; background: color-mix(in srgb, var(--accent) 14%, transparent); flex: none; }
details.fold > summary::after { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg) translate(-2px, -2px); justify-self: center; transition: transform 0.2s; }

.monthly { background: var(--sunk); box-shadow: none; }
.seg-b { border-color: var(--line); background: var(--surface); }
.seg-b[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn { border-radius: 14px; }
.tabs { left: 50%; right: auto; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(480px, calc(100% - 16px)); border: 1px solid var(--line); border-radius: 22px; padding: 4px; box-shadow: 0 12px 32px -14px rgb(0 0 0 / 0.35); background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4); }
.tab { border-radius: 18px; padding: 8px 4px 7px; font-size: 11px; }
.tab[aria-current="page"] { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.wrap { padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
.brand b svg { width: 18px; height: 18px; }
.profiles { display: flex; gap: 6px; margin-top: 14px; padding: 4px; background: var(--sunk); border-radius: 16px; }
.prof { appearance: none; flex: 1 1 0; min-width: 0; border: 0; background: none; color: var(--muted); font: 600 13px var(--font-body); padding: 8px 6px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer; white-space: nowrap; }
.prof .av-s { width: 22px; height: 22px; border-radius: 8px; display: grid; place-items: center; font: 700 11px var(--font-display); background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); flex: none; }
.prof[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.prof[aria-selected="true"] .av-s { background: var(--gold); color: #fff; }
.prof:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.head-r { display: flex; align-items: center; gap: 10px; min-width: 0; }
.head-r .status { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.eye { appearance: none; flex: none; width: 36px; height: 36px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); display: grid; place-items: center; cursor: pointer; box-shadow: var(--shadow); }

.eye[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

<script>
/* ---------------- Référentiels ---------------- */
const ACCOUNT_TYPES = { courant: "Compte courant", livret: "Livret / épargne", pea: "PEA", cto: "Compte-titres", assurance_vie: "Assurance-vie", per: "PER", epargne_salariale: "Épargne salariale", crypto: "Crypto", autre: "Autre" };
const ASSET_CLASSES = { action: "Action", etf: "ETF", fonds: "Fonds / OPCVM", obligation: "Obligation", crypto: "Crypto", fonds_euro: "Fonds euros", autre: "Autre" };
const PROPERTY_TYPES = { residence_principale: "Résidence principale", locatif: "Locatif", secondaire: "Résidence secondaire", scpi: "SCPI" };
const SLICES = [
  { key: "liq", label: "Liquidités", types: ["courant", "livret"] },
  { key: "bourse", label: "Bourse", types: ["pea", "cto"] },
  { key: "av", label: "Assurance-vie / PER", types: ["assurance_vie", "per"] },
  { key: "es", label: "Épargne salariale", types: ["epargne_salariale"] },
  { key: "crypto", label: "Crypto", types: ["crypto"] },
  { key: "immo", label: "Immobilier", types: [] },
  { key: "sci", label: "Parts de SCI", types: [] },
  { key: "autre", label: "Autre", types: ["autre"] },
];

/* ---------------- Format ---------------- */
const eur0 = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
const eur2 = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", minimumFractionDigits: 2, maximumFractionDigits: 2 });
// mode discret : montants masqués, pourcentages visibles (préférence gardée sur cet appareil)
let discret = false; try { discret = localStorage.getItem("socle-discret") === "1"; } catch { }
const HID = "•••\u202f€";
const fE = (v) => discret ? HID : eur0.format(v || 0);
const fE2 = (v) => discret ? HID : eur2.format(v || 0);
const fU = (v) => eur2.format(v || 0); // prix unitaire : public, toujours visible
const fQ = (q) => discret ? "•••" : q.toLocaleString("fr-FR", { maximumFractionDigits: 6 });
const fP = (v, d = 2) => (v < 0 ? "−" : "") + Math.abs(v || 0).toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d }) + " %";
const tone = (v) => (v >= 0 ? "gain" : "loss");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (v) => { const n = Number(String(v ?? "").replace(/\s/g, "").replace(",", ".")); return Number.isFinite(n) ? n : 0; };

/* ---------------- Calculs ---------------- */
function monthlyPayment(P, ratePct, n) {
  const r = ratePct / 100 / 12;
  if (n <= 0) return 0;
  return r === 0 ? P / n : (P * r) / (1 - Math.pow(1 + r, -n));
}
function paidMonths(start, at = new Date()) {
  const s = new Date(start);
  if (isNaN(s)) return 0;
  const m = (at.getFullYear() - s.getFullYear()) * 12 + (at.getMonth() - s.getMonth());
  return Math.max(0, m + (at.getDate() >= s.getDate() ? 0 : -1));
}
function amortization(l) {
  const pmt = monthlyPayment(l.principal, l.rate, l.months), r = l.rate / 100 / 12, s = new Date(l.start);
  let rem = l.principal; const rows = [];
  for (let n = 1; n <= l.months; n++) {
    const interest = rem * r, princ = Math.min(pmt - interest, rem);
    rem = Math.max(0, rem - princ);
    rows.push({ n, year: new Date(s.getFullYear(), s.getMonth() + n, 1).getFullYear(), interest, remaining: rem });
  }
  return rows;
}
function loanStatus(l) {
  const rows = amortization(l), paid = Math.min(paidMonths(l.start), l.months);
  const remaining = paid === 0 ? l.principal : rows[paid - 1].remaining;
  const pmt = monthlyPayment(l.principal, l.rate, l.months);
  const totalInterest = rows.reduce((a, r) => a + r.interest, 0);
  const s = new Date(l.start), end = new Date(s.getFullYear(), s.getMonth() + l.months, 1);
  return {
    rows, paid, remaining, pmt, pmtAll: pmt + (l.insurance || 0), totalInterest,
    interestPaid: rows.slice(0, paid).reduce((a, r) => a + r.interest, 0),
    next12Interest: rows.slice(paid, paid + 12).reduce((a, r) => a + r.interest, 0),
    totalCost: totalInterest + (l.insurance || 0) * l.months,
    progress: l.principal ? (1 - remaining / l.principal) * 100 : 0,
    end: end.toLocaleDateString("fr-FR", { month: "short", year: "numeric" }),
  };
}
function propertyMetrics(p, loans) {
  const share = (p.share ?? 100) / 100;
  const cost = (p.price || 0) + (p.notary || 0) + (p.works || 0);
  const rent = (p.rent || 0) * 12, effRent = rent * (1 - (p.vacancy || 0) / 100);
  const mgmt = effRent * ((p.mgmt || 0) / 100);
  const expenses = (p.charges || 0) * 12 + (p.tax || 0) + (p.pno || 0) + mgmt;
  const net = effRent - expenses;
  const st = loans.map(loanStatus);
  const debt100 = st.reduce((a, s) => a + s.remaining, 0);
  const monthlyLoan = st.reduce((a, s) => a + s.pmtAll, 0);
  // apport personnel via une société (capital + compte courant d'associé) : compté une fois l'acte passé
  const apport = (p.capital || 0) + (p.cca || 0), apportLive = apport > 0 && p.bought && new Date(p.bought) <= new Date() ? apport : 0;
  const equity = ((p.value || 0) - debt100) * share;
  return {
    apport, apportLive,
    cost, rent, effRent, mgmt, expenses, net, monthlyLoan,
    next12Interest: st.reduce((a, s) => a + s.next12Interest, 0),
    gross: cost ? (rent / cost) * 100 : 0, netYield: cost ? (net / cost) * 100 : 0,
    cashflow: net / 12 - monthlyLoan, myCashflow: (net / 12 - monthlyLoan) * share,
    value: (p.value || 0) * share, debt: debt100 * share, equity: equity + apportLive,
    gain: apport ? equity : ((p.value || 0) - cost) * share,
    gainPct: apport ? (equity / apport) * 100 : cost ? (((p.value || 0) - cost) / cost) * 100 : 0,
    sqm: p.surface ? (p.value || 0) / p.surface : null,
  };
}

/* ---------------- État ---------------- */
const S = { accounts: [], holdings: [], properties: [], parts: [], loans: [], snapshots: [], flows: [], ready: false, writable: true };
const COLS = ["accounts", "holdings", "properties", "loans", "snapshots", "flows", "tx", "rules", "caps", "goals", "settings", "market", "prices", "watch"];
// profils : chaque compte / bien porte `profile` (absent = nathan). R garde tout, S ne montre que le profil choisi.
const PROFILES = [{ k: "nathan", label: "Nathan" }, { k: "angelique", label: "Angélique" }, { k: "sci", label: "SCI" }, { k: "foyer", label: "Foyer" }];
// biens d'une SCI : profile "sci" ; chaque associé voit ses parts (share %, partner = profil associé, nathan par défaut), pas l'immeuble
const R = { accounts: [], holdings: [], properties: [], loans: [], snapshots: [], flows: [], tx: [], rules: [], caps: [], goals: [], settings: [], market: [], prices: [], watch: [] };
const openFolds = new Set();
document.addEventListener("toggle", (e) => { const d = e.target; if (d?.dataset?.fold) d.open ? openFolds.add(d.dataset.fold) : openFolds.delete(d.dataset.fold); }, true);
let profile = "nathan"; try { const v = localStorage.getItem("socle-profil"); if (PROFILES.some((p) => p.k === v)) profile = v; } catch { }

function applyProfile(k = profile) {
  const mine = (x) => k === "foyer" || ownerOf(x) === k;
  S.accounts = R.accounts.filter(mine);
  const ids = new Set(S.accounts.map((a) => a.id));

  S.flows = R.flows.filter((f) => ids.has(f.accountId));
  const isSci = (p) => ownerOf(p) === "sci";
  S.properties = k === "sci" ? R.properties.filter(isSci) : R.properties.filter((p) => !isSci(p) && mine(p));
  S.parts = k === "sci" ? [] : R.properties.filter((p) => isSci(p) && (k === "foyer" || (p.partner || "nathan") === k));
  const pids = new Set(S.properties.map((p) => p.id));
  S.loans = R.loans.filter((l) => (l.propertyId ? pids.has(l.propertyId) : mine(l)));
  const pre = snapPrefix(k);
  S.snapshots = R.snapshots.filter((x) => (pre ? x.id.startsWith(pre) : /^\d{4}-\d{2}-\d{2}$/.test(x.id))).map((x) => ({ ...x, id: x.id.slice(pre.length) }));
}

function portfolio() {
  const accRows = S.accounts.map((a) => {
    const hs = S.holdings.filter((h) => h.accountId === a.id);
    return { ...a, hs, value: (a.cash || 0) + hs.reduce((s, h) => s + h.qty * h.price, 0) };
  });
  // vue SCI : l'immeuble à 100 %, sans l'apport personnel de l'associé
  const eff = (p) => profile === "sci" ? { ...p, share: 100, capital: 0, cca: 0 } : p;
  const propRows = S.properties.map((p0) => { const p = eff(p0), loans = S.loans.filter((l) => l.propertyId === p.id); return { ...p, loans, m: propertyMetrics(p, loans) }; });
  const partRows = (S.parts || []).map((p) => { const loans = R.loans.filter((l) => l.propertyId === p.id), m = propertyMetrics(p, loans); return { ...p, loans, m, partValue: m.equity }; });
  const partsVal = partRows.reduce((s, p) => s + p.partValue, 0);
  const otherLoans = S.loans.filter((l) => !l.propertyId || !S.properties.some((p) => p.id === l.propertyId)).map((l) => ({ ...l, s: loanStatus(l) }));
  const alloc = SLICES.map((sl) => ({
    ...sl,
    value: sl.key === "immo" ? propRows.reduce((s, p) => s + p.m.value + p.m.apportLive, 0) : sl.key === "sci" ? Math.max(0, partsVal) : accRows.filter((a) => sl.types.includes(a.type)).reduce((s, a) => s + a.value, 0),
  })).filter((s) => s.value > 0);
  const assets = alloc.reduce((s, x) => s + x.value, 0);
  const debts = propRows.reduce((s, p) => s + p.m.debt, 0) + otherLoans.reduce((s, l) => s + l.s.remaining, 0) + Math.max(0, -partsVal);
  const inv = accRows.filter((a) => isInvestType(a.type)).reduce((s, a) => s + a.value, 0);
  return { accRows, propRows, partRows, partsVal, otherLoans, alloc, assets, debts, inv, net: assets - debts };
}

function donut(alloc) {

    off += len; return el;

}

}
function realNote(h) {

}
function lineChart(points, label, ref) {

  const W = 320, H = 130, pl = 44, pr = 8, pt = 10, pb = 20;
  const ys = [...points.map((p) => p.y), ...(ref > 0 ? [ref] : [])], min = Math.min(...ys), max = Math.max(...ys), small = max < 5000;

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(label)}">
    <defs><linearGradient id="lg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${area}" fill="url(#lg)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>

// ce que tu as mis (prix d'achat, PRU, apport) face à ce que ça vaut aujourd'hui
function costTable(P) {
  const rows = [];

    const dep = a.deposits != null;
    const cost = dep ? a.deposits - (a.withdrawals || 0) : (a.cash || 0) + a.hs.reduce((s, h) => s + h.qty * h.pru, 0);
    rows.push({ base: dep ? a.deposits : null, name: a.name, sub: dep ? `versé ${fE(a.deposits)}${a.withdrawals ? ", retiré " + fE(a.withdrawals) : ""}` : ACCOUNT_TYPES[a.type], cost, value: a.value, act: `data-act="open-account" data-id="${a.id}"` });
  }
  for (const p of P.partRows) if (p.m.apport) rows.push({ name: "Parts " + (p.holder || "SCI"), sub: `ton apport · ${p.share} % des parts`, cost: p.m.apport, value: p.m.apport + p.m.gain, act: `data-profile="sci"` });
  for (const p of P.propRows) {
    const m = p.m, share = (p.share ?? 100) / 100;

    else rows.push({ name: p.name, sub: "prix + frais + travaux", cost: m.cost * share, value: m.value, act: `data-act="open-property" data-id="${p.id}"` });
  }
  const liq = P.accRows.filter((a) => !isInvestType(a.type)).reduce((s, a) => s + a.value, 0);
  if (liq) rows.push({ name: "Liquidités", sub: "comptes courants et livrets", cost: liq, value: liq, act: `data-tab="comptes"` });

  return `<details class="section fold"><summary><span class="fold-t"><h2>Acheté ou investi, face à la valeur</h2><span class="note">mis ${fE(tc)} · vaut ${fE(tv)}</span></span><b class="${tone(tv - tc)}">${sg(tv - tc)}</b></summary>

    </div><p class="note" style="margin-top:6px">Placements : versements moins retraits quand on les connaît, sinon PRU × quantité plus les liquidités du compte. Le bien en SCI compte ton apport face à ta part (valeur moins crédit, plus ton apport).</p></details>`;

// frais annuels : frais courants des fonds (ter) + frais de l'enveloppe (feeUC / feeEuro), en € par an
function feesOf(a) {

  return { fund, env: envF, total: fund + envF, unknown, lines, known: a.feeUC != null || a.hs.some((h) => h.ter != null) };
}

  const pc = (c, v) => fP(v ? (c / v) * 100 : 0, 2);

      <div><span class="note">À 5 %/an avant frais, sans nouveau versement. « Frais payés » = la somme des frais prélevés ; le montant en rouge = le manque à gagner total, car les frais ne rapportent plus d'intérêts composés.</span></div></div>
    <div class="panel list" style="margin-top:10px">${rows.map(({ a, f }) => `<button class="row" data-act="open-account" data-id="${a.id}"><span><div class="name">${esc(a.name)}</div>
      <div class="meta">fonds ${fE(f.fund)} · enveloppe ${fE(f.env)}${f.unknown ? ` · ${f.unknown} ligne${f.unknown > 1 ? "s" : ""} sans frais renseignés` : ""}${a.feeNote ? `<br>${esc(a.feeNote)}` : ""}</div></span>
      <span class="amt">${fE(f.total)}<small class="note">/an · ${pc(f.total, a.value)}</small></span></button>`).join("")}</div>
    ${lines.length ? `<div class="section-head" style="margin-top:14px"><h2 style="font-size:15px">Les lignes les plus chères</h2><span class="note">fonds + enveloppe, en %/an</span></div>
    <div class="panel list">${lines.map((l) => `<button class="row" data-act="edit-holding" data-id="${l.id}"><span><div class="name">${esc(l.name)}</div>
      <div class="meta">${esc(l.acc)} · fonds ${l.ter != null ? fP(l.ter, 2) : "?"} + enveloppe ${fP(l.env || 0, 2)}</div></span>
      <span class="amt">${pc(l.cost, l.v)}<small class="note">${fE(l.cost)} /an</small></span></button>`).join("")}</div>` : ""}
    <p class="note" style="margin-top:6px">Frais courants des fonds (prélevés dans leur cours, donc invisibles sur tes relevés) et frais de gestion de l'enveloppe. Les actions détenues en direct n'ont pas de frais courants ; le courtage et les frais d'entrée sont ponctuels et ne sont pas comptés ici.</p></details>`;
}
// performance depuis une valeur de départ connue (31/12), hors versements et retraits ; % rapporté au capital engagé (départ + versements)
function accountPerf(a) {
  if (a.startValue == null || !a.startDate) return null;
  const fl = S.flows.filter((f) => f.accountId === a.id && f.date > a.startDate);
  const net = fl.reduce((s, f) => s + (Number(f.amount) || 0), 0);
  const gain = a.value - a.startValue - net, base = a.startValue + fl.reduce((s, f) => s + Math.max(0, Number(f.amount) || 0), 0);
  return { gain, net, start: a.startValue, pct: base > 0 ? (gain / base) * 100 : null };
}
function ytdTable(P) {
  const rows = P.accRows.filter((a) => isInvestType(a.type)).map((a) => ({ a, r: accountPerf(a) })).filter((x) => x.r);
  if (!rows.length) return profile === "sci" || !P.accRows.some((a) => isInvestType(a.type)) ? "" : emptyFold("ytd", `Performance ${new Date().getFullYear()} des placements`, "gain des marchés, hors versements", `Ouvre chaque compte de placement (Comptes) et renseigne « Valeur au 31/12 de l'an dernier » et sa date : la performance de l'année se calcule alors toute seule.`);
  const missing = P.accRows.filter((a) => isInvestType(a.type) && a.value > 0 && a.startValue == null);
  const g = rows.reduce((s, x) => s + x.r.gain, 0);
  const start = rows.reduce((s, x) => s + x.r.start, 0), net = rows.reduce((s, x) => s + x.r.net, 0);
  const year = new Date(rows[0].a.startDate).getFullYear() + 1;
  return `<details class="section fold"><summary><span class="fold-t"><h2>Performance ${year} des placements</h2><span class="note">gain des marchés, hors versements</span></span><b class="${tone(g)}">${sg(g)}</b></summary>
    <div class="panel list">${rows.map(({ a, r }) => `<button class="row" data-act="open-account" data-id="${a.id}"><span><div class="name">${esc(a.name)}</div>
      <div class="meta">31/12 : ${fE(r.start)} · ${r.net >= 0 ? "versé" : "retiré"} ${fE(Math.abs(r.net))} · aujourd'hui ${fE(a.value)}</div></span>
      <span class="amt"><span class="${tone(r.gain)}">${sg(r.gain)}</span>${r.pct != null ? `<small class="${tone(r.gain)}">${r.pct >= 0 ? "+" : ""}${fP(r.pct, 1)}</small>` : ""}</span></button>`).join("")}
      <div class="row"><span><div class="name"><b>Total</b></div><div class="meta">départ ${fE(start)} · flux nets ${sg(net)}</div></span><span class="amt"><b class="${tone(g)}">${sg(g)}</b></span></div>
    </div>${missing.length ? `<p class="note" style="margin-top:6px">Sans valeur au 31/12 : ${missing.map((a) => esc(a.name)).join(", ")}.</p>` : ""}</details>`;
}
const sg = (v) => (v >= 0 ? "+" : "−") + fE(Math.abs(v));
// variation du net entre une photo et aujourd'hui, séparée entre marchés et épargne
function decomposition(P, firstSnap, rangeSnap) {
  const base = rangeSnap || firstSnap;
  if (!base || base.inv == null || base.assets == null || base.id === new Date().toISOString().slice(0, 10)) return null;
  const flows = S.flows.filter((f) => f.date > base.id).reduce((a, f) => a + (Number(f.amount) || 0), 0);
  const total = P.net - (base.assets - base.debts), market = P.inv - base.inv - flows;
  return { from: new Date(base.id).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }), total, market, saved: total - market, flows,
    marketPct: base.inv + flows / 2 > 0 ? (market / (base.inv + flows / 2)) * 100 : null };
}

const ENVELOPES = [
  { k: "all", label: "Tout" },
  { k: "cto", label: "CTO" },
  { k: "pea", label: "PEA" },
  { k: "assurance_vie", label: "Assurance-vie" },
  { k: "courant", label: "Compte courant" },
  { k: "livret", label: "Livrets" },
  { k: "epargne_salariale", label: "Épargne salariale" },
  { k: "per", label: "PER" },
  { k: "crypto", label: "Crypto" },
  { k: "autre", label: "Autre" },
];
const ALWAYS = ["all", "cto", "pea", "assurance_vie", "epargne_salariale", "courant", "livret"];
let env = "all";
let posSort = "perf";

function accountRow(a) {
  const pnl = a.hs.reduce((s, h) => s + h.qty * (h.price - h.pru), 0);
  const bits = [a.institution ? esc(a.institution) : "", a.updatedAt ? ago(a.updatedAt) : "", a.hs.length ? `${a.hs.length} ligne${a.hs.length > 1 ? "s" : ""}` : ""].filter(Boolean).join(" · ");
  const sl = (SLICES.find((x) => x.types.includes(a.type)) || { key: "autre" }).key;
  return `<button class="row with-av" data-act="open-account" data-id="${a.id}"><span class="av" style="--c:var(--c-${sl})">${esc((a.institution || a.name).trim().charAt(0).toUpperCase())}</span>
    <span><div class="name">${esc(a.name)}</div><div class="meta">${bits}</div></span>
    <span class="amt">${fE(a.value)}${a.hs.length ? `<small class="${tone(pnl)}">${pnl >= 0 ? "+" : "−"}${fE(Math.abs(pnl))}</small>` : ""}</span></button>`;
}
function holdingRows(list, showAccount) {
  return list.map((h) => {
    const v = h.qty * h.price, g = h.qty * (h.price - h.pru), gp = h.pru ? ((h.price - h.pru) / h.pru) * 100 : 0;
    return `<button class="row" data-act="edit-holding" data-id="${h.id}"><span><div class="name">${esc(h.name)}</div>
      <div class="meta">${showAccount ? esc(h.accName) + " · " : ""}${fQ(h.qty)} × ${fU(h.price)} · PRU ${fU(h.pru)}${h.planAmount > 0 ? ` · plan ${fE(h.planAmount)}/mois` : ""}</div></span>
      <span class="amt">${fE(v)}<small class="${tone(g)}">${g >= 0 ? "+" : "−"}${fE(Math.abs(g))} · ${fP(gp, 1)}</small></span></button>`;
  }).join("");
}

function viewComptes(P) {
  const present = new Set(P.accRows.map((a) => a.type));
  const envs = ENVELOPES.filter((e) => ALWAYS.includes(e.k) || present.has(e.k));
  if (!envs.some((e) => e.k === env)) env = "all";
  const rows = P.accRows.filter((a) => env === "all" || a.type === env).sort((a, b) => b.value - a.value);
  const total = rows.reduce((s, a) => s + a.value, 0);
  const cash = rows.reduce((s, a) => s + (a.cash || 0), 0);
  const hs = rows.flatMap((a) => a.hs.map((h) => ({ ...h, accName: a.name })));
  const inv = hs.reduce((s, h) => s + h.qty * h.pru, 0), pnl = hs.reduce((s, h) => s + h.qty * (h.price - h.pru), 0);
  const label = ENVELOPES.find((e) => e.k === env).label;
  const isInvest = !["courant", "livret"].includes(env);
  const chips = `<div class="seg" role="tablist" aria-label="Enveloppes">${envs.map((e) => {
    const n = e.k === "all" ? P.accRows.length : P.accRows.filter((a) => a.type === e.k).length;
    return `<button role="tab" class="seg-b" aria-selected="${e.k === env}" data-env="${e.k}">${e.label}${n ? ` <span>${n}</span>` : ""}</button>`;
  }).join("")}</div>`;
  let body;
  if (env === "all") {
    const groups = Object.entries(ACCOUNT_TYPES).map(([k, l]) => ({ k, l, rows: rows.filter((a) => a.type === k) })).filter((g) => g.rows.length);
    body = groups.map((g) => `<section class="section"><div class="section-head"><h2>${g.l}</h2><span class="total">${fE(g.rows.reduce((s, a) => s + a.value, 0))}</span></div>
      <div class="panel list">${g.rows.map(accountRow).join("")}</div></section>`).join("") || `<div class="section"><div class="panel empty">Aucun compte pour l'instant.</div></div>`;
  } else {
    body = `
    ${isInvest && rows.length ? `<div class="grid2" style="margin-top:4px">${tile("Investi (PRU)", hs.length ? fE(inv) : "—", hs.length ? "" : "aucune position saisie")}${tile("Plus-value latente", hs.length ? fE(pnl) : "—", hs.length && inv ? fP((pnl / inv) * 100) : "", hs.length ? tone(pnl) : "")}${tile("Liquidités", fE(cash))}${tile("Positions", String(hs.length))}</div>` : ""}
    <section class="section"><div class="section-head"><h2>${rows.length > 1 ? "Comptes" : "Compte"}</h2></div>
      <div class="panel list">${rows.map(accountRow).join("") || `<div class="empty">Aucun compte ${label} pour l'instant.</div>`}</div></section>
    ${isInvest && rows.length ? `<section class="section"><div class="section-head"><h2>Positions</h2>${rows.length === 1 ? `<button class="btn ghost sm" data-act="new-holding" data-id="${rows[0].id}">Ajouter</button>` : ""}</div>
      <div class="panel list">${holdingRows(hs.sort((a, b) => b.qty * b.price - a.qty * a.price), rows.length > 1) || `<div class="empty">Aucune position. Ouvre le compte pour en ajouter : le solde actuel reste compté en liquidités.</div>`}</div></section>` : ""}`;
  }
  return `
  <section class="hero"><div class="eyebrow">${env === "all" ? "Comptes et placements" : label}</div><div class="big">${fE(total)}</div></section>
  ${chips}
  ${P.accRows.length ? `<button class="btn ghost add" data-act="monthly" style="margin-block:12px 6px">Mise à jour du mois</button>` : ""}
  ${body}
  <div class="section"><button class="btn add" data-act="new-account" ${env !== "all" ? `data-type="${env}"` : ""}>Ajouter ${env === "all" ? "un compte" : "un compte " + label}</button></div>`;
}

function viewPositions(P) {
  const all = P.accRows.flatMap((a) => a.hs.map((h) => ({ ...h, accName: a.name, accType: a.type })));
  // regroupe une même valeur détenue dans plusieurs enveloppes
  const map = new Map();
  for (const h of all) {
    const key = (h.ticker || h.name).trim().toUpperCase();
    const g = map.get(key) || { name: h.name, ticker: h.ticker, cls: h.cls, expo: h.expo, qty: 0, cost: 0, value: 0, lines: [] };
    g.qty += h.qty; g.cost += h.qty * h.pru; g.value += h.qty * h.price; g.lines.push(h);
    map.set(key, g);
  }
  const perfOf = (g) => (g.cost ? (g.value - g.cost) / g.cost : 0);
  const groups = [...map.values()].sort((a, b) => posSort === "perf" ? perfOf(b) - perfOf(a) || b.value - a.value : b.value - a.value);
  const total = groups.reduce((s, g) => s + g.value, 0), cost = groups.reduce((s, g) => s + g.cost, 0), pnl = total - cost;
  const byCls = {}; for (const g of groups) byCls[g.cls || "autre"] = (byCls[g.cls || "autre"] || 0) + g.value;
  if (!groups.length) return `
    <section class="hero"><div class="eyebrow">Positions en portefeuille</div><div class="big">${fE(0)}</div></section>
    <div class="panel empty">Aucune position pour l'instant. Tes comptes importés n'ont que leur solde.<br>Ouvre un PEA, un CTO ou une assurance-vie dans Comptes et ajoute tes lignes (quantité, PRU, cours).<br><button class="btn" data-tab="comptes">Aller aux comptes</button></div>`;
  return `
  <section class="hero"><div class="eyebrow">Positions en portefeuille</div><div class="big">${fE(total)}</div>
    <div class="sub"><span class="${tone(pnl)}">${pnl >= 0 ? "+" : "−"}${fE(Math.abs(pnl))} · ${fP(cost ? (pnl / cost) * 100 : 0)}</span> sur ${fE(cost)} investis</div></section>
  <div class="panel kv">${Object.entries(byCls).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div><span>${ASSET_CLASSES[k] || k}</span><span>${fE(v)} · ${fP((v / total) * 100, 1)}</span></div>`).join("")}</div>
  ${plansPanel(P)}
  ${exposure(groups, total)}
  <section class="section"><div class="section-head"><h2>${groups.length} ligne${groups.length > 1 ? "s" : ""}</h2><span class="note">${posSort === "perf" ? "de la meilleure à la moins bonne" : "les plus grosses d'abord"}</span></div>
    <div class="seg" role="tablist" aria-label="Trier les positions" style="margin-bottom:10px">${[["perf", "Performance"], ["poids", "Poids"]].map(([k, l]) => `<button role="tab" class="seg-b" aria-selected="${posSort === k}" data-possort="${k}">${l}</button>`).join("")}</div>
    <div class="panel list">${groups.map((g, i) => {
      const gp = g.cost ? ((g.value - g.cost) / g.cost) * 100 : 0, pru = g.qty ? g.cost / g.qty : 0, w = total ? (g.value / total) * 100 : 0;
      const where = [...new Set(g.lines.map((l) => l.accName))].join(", ");
      const target = g.lines.length === 1 ? `data-act="edit-holding" data-id="${g.lines[0].id}"` : `data-act="open-account" data-id="${g.lines[0].accountId}"`;
      return `<button class="row" ${target}><span><div class="name">${posSort === "perf" ? `<span class="note" style="display:inline-block;min-width:1.6em">${i + 1}.</span>` : ""}${esc(g.name)}${g.ticker ? ` <span class="pill">${esc(g.ticker)}</span>` : ""}</div>
        <div class="meta">${esc(where)} · ${fQ(g.qty)} · PRU ${fU(pru)}</div>
        <div class="bar" style="margin-top:6px;max-width:160px"><i style="width:${w.toFixed(1)}%"></i></div></span>
        ${posSort === "perf"
          ? `<span class="amt"><span class="${tone(g.value - g.cost)}">${g.cost < g.value * 0.01 ? "offerte" : (gp > 0 ? "+" : "") + fP(gp, 1)}</span><small class="${tone(g.value - g.cost)}">${g.value >= g.cost ? "+" : "−"}${fE(Math.abs(g.value - g.cost))}</small><small class="note">${fE(g.value)} · ${fP(w, 1)}</small></span></button>`
          : `<span class="amt">${fE(g.value)}<small class="note">${fP(w, 1)}</small><small class="${tone(g.value - g.cost)}">${g.value >= g.cost ? "+" : "−"}${fE(Math.abs(g.value - g.cost))} · ${fP(gp, 1)}</small></span></button>`}`;
    }).join("")}</div></section>`;
}

// exposition réelle : chaque ligne porte sa répartition (expo.geo en %, expo.tech en %)
function exposure(groups, total) {
  const geo = {}; let tech = 0, known = 0;
  for (const g of groups) {
    if (!g.expo?.geo) { geo["Non renseigné"] = (geo["Non renseigné"] || 0) + g.value; continue; }
    known += g.value; tech += g.value * (g.expo.tech || 0) / 100;
    const sum = Object.values(g.expo.geo).reduce((a, b) => a + b, 0) || 100;
    for (const [k, v] of Object.entries(g.expo.geo)) geo[k] = (geo[k] || 0) + g.value * v / sum;
  }
  if (!known) return "";
  const rows = Object.entries(geo).sort((a, b) => b[1] - a[1]);
  const bar = (label, v, sub) => `<div style="display:grid;gap:4px"><div class="section-head"><span>${label}</span><span><b>${fP((v / total) * 100, 1)}</b> <span class="note">${sub}</span></span></div><div class="bar"><i style="width:${((v / total) * 100).toFixed(1)}%"></i></div></div>`;
  return `<section class="section"><div class="section-head"><h2>Exposition réelle</h2><span class="note">estimation, fonds et ETF regardés en transparence</span></div>
    <div class="panel" style="display:grid;gap:12px">${rows.map(([k, v]) => bar(esc(k), v, fE(v))).join("")}</div>
    <div class="panel" style="display:grid;gap:12px;margin-top:10px">${bar("Tech et télécoms", tech, fE(tech))}<p class="note">Part de tes placements dans la tech (logiciels, semi-conducteurs, internet, télécoms), toutes lignes confondues.</p></div></section>`;
}

function viewImmo(P) {

    <p class="note" style="margin-top:6px">Valeur de tes parts = ${P.partRows[0].share} % de (valeur de l'immeuble − crédit restant) + ton apport (capital et compte courant d'associé) une fois l'acte signé.</p></section>` : "";
  return `

  ${parts}

  <section class="section">
    <div class="panel list">${R.map((p) => `<button class="row" data-act="open-property" data-id="${p.id}">
      <span><div class="name">${esc(p.name)}</div><div class="meta">${PROPERTY_TYPES[p.type] || ""}${p.city ? " · " + esc(p.city) : ""}${(p.share ?? 100) < 100 ? " · " + p.share + " %" : ""}</div></span>
      <span class="amt">${fE(p.m.value)}${p.m.rent ? `<small class="${tone(p.m.netYield)}">${fP(p.m.netYield)} net</small>` : `<small class="note">${fE(p.m.debt)} dû</small>`}</span></button>`).join("") || `<div class="empty">${P.partRows.length ? "Aucun bien en direct." : "Aucun bien pour l'instant."}</div>`}</div>
  </section>
  <div class="section"><button class="btn add" data-act="new-property">Ajouter un bien</button></div>`;
}

function sheetAccount(a) {

      const v = h.qty * h.price, g = h.qty * (h.price - h.pru), gp = h.pru ? ((h.price - h.pru) / h.pru) * 100 : 0;
      return `<button class="row" data-act="edit-holding" data-id="${h.id}"><span><div class="name">${esc(h.name)}</div>
        <div class="meta">${fQ(h.qty)} × ${fU(h.price)} · PRU ${fU(h.pru)}</div></span>

// épargne nette mensuelle moyenne (budget) : base des objectifs et de la projection
// dépenses d'une personne = ses comptes perso + ce qu'elle verse sur le compte joint (sa part du joint) ; Foyer = tout, joint compris
function avgSaving() {
  const keep = bScope; bScope = "all"; const D = budgetData(); bScope = keep;
  const now = new Date().toISOString().slice(0, 7), solo = profile === "nathan" || profile === "angelique";
  const own = solo ? D.tx.filter((t) => t.accountId !== "joint") : D.tx;
  const months = [...new Set(own.map((t) => ym(t.date)))].filter((m) => m < now).sort().slice(-3);
  if (!months.length) return null;
  const s = months.map((m) => {
    const T = monthTotals(own.filter((t) => ym(t.date) === m));
    if (!solo) return T;
    const c = D.tx.filter((t) => t.accountId === "joint" && ym(t.date) === m && t.amount > 0 && t.c === "interne" && whoOf(t) === profile).reduce((x, t) => x + t.amount, 0);
    return { ...T, out: T.out + c, rest: T.rest - c, joint: c };
  });
  return { save: s.reduce((a, x) => a + x.save, 0) / s.length, rest: s.reduce((a, x) => a + x.rest, 0) / s.length, out: s.reduce((a, x) => a + x.out, 0) / s.length, joint: solo ? s.reduce((a, x) => a + x.joint, 0) / s.length : null, n: months.length };
}
// charges fixes : paiements récurrents de tes comptes perso + ce que tu vires sur le joint (Foyer : récurrents de tous les comptes)
function fixedCharges() {
  const keep = bScope; bScope = "all"; const D = budgetData(); bScope = keep;
  const now = new Date().toISOString().slice(0, 7), solo = profile === "nathan" || profile === "angelique";
  const own = solo ? { ...D, tx: D.tx.filter((t) => t.accountId !== "joint") } : D;
  // dernier mois complet connu (le joint suffit si les comptes perso n'ont pas encore de relevés)
  const last = [...new Set(D.tx.map((t) => ym(t.date)))].filter((m) => m < now).sort().pop();
  if (!last) return null;
  // seulement les vraies charges : logement, abonnements, assurances, transport (pas les achats ou virements ponctuels)
  const items = recurring(own, last).filter((r) => ["logement", "abos"].includes(r.c) || RECUR_RE.test(normL(r.label))).map((r) => ({ label: r.label, amt: r.perMonth }));
  // virement au joint du dernier mois complet : c'est ton rythme actuel
  const joint = solo ? D.tx.filter((t) => t.accountId === "joint" && ym(t.date) === last && t.amount > 0 && t.c === "interne" && whoOf(t) === profile).reduce((x, t) => x + t.amount, 0) : 0;
  if (joint > 0) items.unshift({ label: "Virement sur le compte joint", amt: joint, joint: true });
  const auto = items.reduce((x, i) => x + i.amt, 0), manual = num(setOf(profile).fixed) || 0;
  return { items, auto, manual, total: manual || auto };
}

// projection du patrimoine net
let proj = null;
function projData(P, save, ret, years = 20) {
  const liq0 = P.accRows.filter((a) => ["courant", "livret"].includes(a.type)).reduce((s, a) => s + a.value, 0);
  const inv0 = P.accRows.filter((a) => !["courant", "livret"].includes(a.type)).reduce((s, a) => s + a.value, 0);
  const now = new Date(), pts = [];
  let liq = liq0, inv = inv0, put = 0;
  for (let m = 0; m <= years * 12; m++) {
    if (m) { liq *= 1 + 0.017 / 12; inv = inv * (1 + ret / 100 / 12) + save; put += save; }
    if (m % 3 && m !== years * 12) continue;
    const at = new Date(now.getFullYear(), now.getMonth() + m, 1);
    let immo = 0, debt = 0;
    for (const p of P.propRows) {
      const share = (p.share ?? 100) / 100;
      immo += (p.value || 0) * share * Math.pow(1.01, m / 12) + (p.m.apportLive || (p.m.apport && p.bought && new Date(p.bought) <= at ? p.m.apport : 0));
      for (const l of p.loans) { const st = loanStatus(l), k = Math.min(paidMonths(l.start, at), l.months); debt += (k ? st.rows[k - 1].remaining : l.principal) * share; }
    }
    for (const p of P.partRows) {
      const share = (p.share ?? 100) / 100; let d = 0;
      for (const l of p.loans) { const st = loanStatus(l), k = Math.min(paidMonths(l.start, at), l.months); d += k ? st.rows[k - 1].remaining : l.principal; }
      immo += ((p.value || 0) * Math.pow(1.01, m / 12) - d) * share + (p.m.apport && p.bought && new Date(p.bought) <= at ? p.m.apport : 0);
    }
    for (const l of P.otherLoans) { const k = Math.min(paidMonths(l.start, at), l.months); debt += k ? l.s.rows[k - 1].remaining : l.principal; }
    pts.push({ m, t: at.getTime(), net: liq + inv + immo - debt, fin: liq + inv, put });
  }
  return pts;
}
function projChart(pts) {
  const W = 320, H = 150, pad = 8, max = Math.max(...pts.map((p) => p.net)), min = Math.min(0, ...pts.map((p) => p.net));
  const x = (i) => pad + (i / (pts.length - 1)) * (W - 2 * pad), y = (v) => H - 20 - ((v - min) / (max - min || 1)) * (H - 34);
  const path = (k) => pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[k]).toFixed(1)}`).join("");
  const marks = [5, 10, 20].map((yr) => { const i = pts.findIndex((p) => p.m === yr * 12); if (i < 0) return ""; return `<line x1="${x(i)}" x2="${x(i)}" y1="${y(pts[i].net)}" y2="${H - 20}" stroke="var(--line)" stroke-dasharray="3 3"/><circle cx="${x(i)}" cy="${y(pts[i].net)}" r="3.5" fill="var(--gold)"/><text x="${x(i)}" y="${H - 6}" text-anchor="middle">${yr} ans</text>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Projection du patrimoine net"><defs><linearGradient id="pg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    <path d="${path("net")}L${x(pts.length - 1)},${H - 20}L${x(0)},${H - 20}Z" fill="url(#pg)"/><path d="${path("net")}" fill="none" stroke="var(--accent)" stroke-width="2"/><path d="${path("fin")}" fill="none" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="4 3"/>${marks}</svg>`;
}

function taxSection(P) {
  const PFU = 31.4, PS = 18.6, now = new Date();
  const gain = (a) => a.hs.reduce((s, h) => s + h.qty * (h.price - h.pru), 0);
  const peas = P.accRows.filter((a) => a.type === "pea"), ctos = P.accRows.filter((a) => a.type === "cto" || a.type === "crypto"), avs = P.accRows.filter((a) => a.type === "assurance_vie"), livs = P.accRows.filter((a) => a.type === "livret");
  // les moins-values d'un compte-titres compensent les plus-values des autres (même foyer fiscal, même année)
  const ctoGain = ctos.reduce((s, a) => s + gain(a), 0), ctoTax = Math.max(0, ctoGain) * PFU / 100;
  const ctoLines = ctos.flatMap((a) => a.hs.map((h) => ({ n: h.name, g: h.qty * (h.price - h.pru) }))).filter((l) => Math.abs(l.g) >= 1).sort((x, y) => Math.abs(y.g) - Math.abs(x.g));
  // PEA et assurance-vie : gain imposable au retrait = valeur − versements (sinon d'après les PRU)
  const envGain = (a) => a.deposits > 0 ? a.value - a.deposits : gain(a);
  const fiveOk = (a) => { if (!a.openedAt) return false; const d = new Date(a.openedAt); d.setFullYear(d.getFullYear() + 5); return d <= now; };
  const eightOk = (a) => { if (!a.openedAt) return false; const d = new Date(a.openedAt); d.setFullYear(d.getFullYear() + 8); return d <= now; };
  const peaGain = peas.reduce((s, a) => s + envGain(a), 0), peaTax = peas.reduce((s, a) => s + Math.max(0, envGain(a)) * (fiveOk(a) ? PS : PFU) / 100, 0);
  const avGain = avs.reduce((s, a) => s + envGain(a), 0), avTax = avs.reduce((s, a) => { const g = Math.max(0, envGain(a)); return s + (eightOk(a) ? g * PS / 100 + Math.max(0, g - 4600) * 7.5 / 100 : g * PFU / 100); }, 0);
  const crypNo = ctos.filter((a) => a.type === "crypto" && !a.hs.length && a.value > 0);

  };
  const avRow = (a) => {

    const eight = new Date(a.openedAt); eight.setFullYear(eight.getFullYear() + 8);
    return `<div><span>${esc(a.name)} <small class="note">ouvert le ${new Date(a.openedAt).toLocaleDateString("fr-FR")}</small></span><span>${eight <= now ? '<b class="gain">8 ans atteints</b>' : "8 ans le " + eight.toLocaleDateString("fr-FR")}</span></div>`;
  };
  return `<details class="section fold"><summary><span class="fold-t"><h2>Fiscalité</h2><span class="note">PEA, compte-titres, assurance-vie, livrets</span></span><b>${ctoTax + peaTax + avTax ? fE(ctoTax + peaTax + avTax) + "<small> si tu vends tout</small>" : "—"}</b></summary>
    ${peas.length ? `<div class="panel kv"><div class="strong"><span>PEA : l'horloge des 5 ans</span><span></span></div>${peas.map(peaRow).join("")}
      <div><span>Plus-values latentes <small class="note">valeur − versements</small></span><span class="${tone(peaGain)}">${fE(peaGain)}</span></div>
      <div><span>Impôt si tu retirais tout aujourd'hui</span><span>${fE(peaTax)}</span></div>
      <div><span class="note">Avant 5 ans, un retrait clôture le PEA et les gains sont taxés à ${fP(PFU, 1)}. Après 5 ans, seuls les prélèvements sociaux (${fP(PS, 1)}) restent dus sur les gains.</span></div></div>` : ""}

    <div><span class="note">Soldes saisis, moins les paiements récurrents pas encore passés ce mois-ci, plus le salaire moyen s'il n'est pas encore arrivé. Les virements entre vos comptes ne sont pas comptés.</span></div></div></section>`;

// 2. équilibre du compte joint : qui a versé quoi face aux dépenses du joint

// 4. comparaison avec le mois précédent, par catégorie
function compareSection(series, D) {
  const cur = series[series.length - 1], isCur = cur.m === curMonth(), dd = new Date().getDate();
  // mois en cours : comparé au mois précédent arrêté au même jour
  const prev = isCur ? { m: series[series.length - 2].m, ...monthTotals(D.tx.filter((t) => ym(t.date) === series[series.length - 2].m && Number(t.date.slice(8, 10)) <= dd)) } : series[series.length - 2];
  if (!prev || !Object.keys(prev.by).length || !Object.keys(cur.by).length) return emptyFold("cmp", "Comparaison avec le mois précédent", "dépenses en hausse ou en baisse", NEED_TX().replace("au moins un mois complet", "deux mois"));
  const hist = series.slice(0, -1).filter((s) => Object.keys(s.by).length);
  const rows = Object.keys(BCATS).filter((c) => BCATS[c][1] === "out").map((c) => {
    const v = -(cur.by[c] || 0), p = -(prev.by[c] || 0), a = hist.reduce((s, x) => s - (x.by[c] || 0), 0) / hist.length;
    return { c, v, p, a, d: v - p };
  }).filter((r) => Math.abs(r.v) > 0.5 || Math.abs(r.p) > 0.5).sort((x, y) => y.d - x.d);
  const dT = cur.out - prev.out;

    <div class="panel list">${rows.map((r) => `<button class="row" data-bcat="${r.c}"><span class="txl"><span class="dot" style="background:${BCATS[r.c][2]}"></span><span style="min-width:0"><div class="name">${BCATS[r.c][0]}</div><div class="meta">${fE(r.p)} en ${monthName(prev.m, false)}${isCur ? ` au ${dd}` : ""}${hist.length > 1 ? ` · moy. ${fE(r.a)}` : ""}</div></span></span>
      <span class="amt">${fE(r.v)}<small class="${r.d > 0.5 ? "loss" : r.d < -0.5 ? "gain" : "note"}">${Math.abs(r.d) < 0.5 ? "stable" : sg(r.d)}</small></span></button>`).join("")}</div></details>`;
}

// 5. recherche dans toutes les opérations : texte, montant exact (12,99) ou seuil (>100, <20)

function matchTx(t, q) {
  const hay = normL(`${t.label} ${t.note || ""} ${BCATS[t.c]?.[0] || ""} ${accLabel(t.accountId)}`), a = Math.abs(t.amount);
  return normL(q).split(" ").filter(Boolean).every((tok) => {
    const m = tok.match(/^([<>]=?|=)?(\d+(?:[.,]\d+)?)$/);
    if (m) { const v = num(m[2]); return m[1]?.startsWith(">") ? a >= v : m[1]?.startsWith("<") ? a <= v : Math.abs(a - v) < 0.005 || hay.includes(tok); }

}

// 3. paiement récurrent dont le montant a changé d'un mois à l'autre
function recurChange(ts) {
  const last = ts[0], prev = ts.find((t) => ym(t.date) < ym(last.date));
  if (!prev) return null;
  const a = -prev.amount, b = -last.amount;
  return Math.abs(b - a) > 1 && Math.abs(b - a) / a > 0.03 ? { from: a, to: b } : null;

// 6. plans d'épargne programmés : chaque mois échu ajoute (montant / cours) parts et un versement
const planOf = (h) => h.planAmount > 0 ? { amount: h.planAmount, day: h.planDay || 2, last: h.planLast } : null;

  const now = new Date(); let d = new Date(now.getFullYear(), now.getMonth(), p.day);
  if (d <= now || (p.last && p.last >= curMonth())) d = new Date(now.getFullYear(), now.getMonth() + 1, p.day);
  return d;
}
let plansDone = false;
async function applyPlans() {
  if (plansDone || !db || !S.ready || !S.writable) return;
  plansDone = true;
  const now = new Date(), cm = curMonth();
  for (const h of R.holdings) {
    const p = planOf(h); if (!p || !(h.price > 0)) continue;
    const due = now.getDate() >= p.day ? cm : shiftM(cm, -1);
    try {
      // première fois : les quantités saisies comprennent déjà les achats passés

      let m = p.last, qty = h.qty, cost = h.qty * h.pru; const dates = [];
      while (m < due) { m = shiftM(m, 1); qty += p.amount / h.price; cost += p.amount; dates.push(`${m}-${String(p.day).padStart(2, "0")}`); }
      if (!dates.length) continue;
      await db.collection("holdings").doc(h.id).update({ qty: +qty.toFixed(6), pru: +(cost / qty).toFixed(4), planLast: m, planNote: `${dates.length} échéance${dates.length > 1 ? "s" : ""} ajoutée${dates.length > 1 ? "s" : ""} automatiquement le ${now.toLocaleDateString("fr-FR")}, au cours de ${h.price.toFixed(2)} €`, updatedAt: now.toISOString() });
      for (const d of dates) await db.collection("flows").add({ accountId: h.accountId, date: d, amount: p.amount, note: `Plan d'épargne ${h.name}`, auto: true, createdAt: now.toISOString() });
    } catch { /* lecture seule ou conflit : on réessaiera à la prochaine ouverture */ }
  }
}

const RB_KEYS = ["liq", "bourse", "av", "es", "crypto"];
let rbAmt = null;
function rbPlan(cur, tgt, amt) {
  const tot = RB_KEYS.reduce((s, k) => s + (cur[k] || 0), 0) + amt;
  const need = RB_KEYS.map((k) => [k, Math.max(0, (tot * (tgt[k] || 0)) / 100 - (cur[k] || 0))]);
  const sum = need.reduce((s, [, v]) => s + v, 0);
  return need.filter(([, v]) => v > 0.5).map(([k, v]) => [k, sum > amt ? (v * amt) / sum : v]).sort((a, b) => b[1] - a[1]);
}
const slLabel = (k) => SLICES.find((s) => s.key === k)?.label || k;
function rbOut(cur, tgt, amt) {
  const pl = rbPlan(cur, tgt, amt);
  return pl.length ? pl.map(([k, v]) => `<div><span><span class="dot" style="display:inline-block;background:var(--c-${k});margin-right:6px"></span>${slLabel(k)}</span><b>${fE(v)}</b></div>`).join("") : `<div><span class="note">Tu es déjà sur ta cible : répartis comme tu veux.</span></div>`;
}
function rebalCur(P) { return Object.fromEntries(RB_KEYS.map((k) => [k, (P.alloc.find((a) => a.key === k) || {}).value || 0])); }
function rebalSection(P) {
  if (profile === "sci" || profile === "foyer") return "";

// taux immobiliers moyens du jour : doc settings "rates" (mis à jour par Claude), sinon valeurs de novembre 2026
const RATES_DEF = { date: "2026-11-04", src: "Pretto, baromètre de novembre 2026", t15: 3.56, t20: 3.76, t25: 3.85, best20: 3.47 };

// patrimoine financier : comptes + parts de société
const finWealth = (P) => P.accRows.reduce((s, a) => s + a.value, 0) + Math.max(0, P.partsVal || 0);
function monthsTo(cur, target, save, ratePct) { const r = ratePct / 1200; let v = cur; for (let m = 0; m <= 1200; m++) { if (v >= target) return m; v = v * (1 + r) + save; } return null; }
function needMonthly(cur, target, months, ratePct) { const r = ratePct / 1200, g = Math.pow(1 + r, months); return Math.max(0, r ? ((target - cur * g) * r) / (g - 1) : (target - cur) / months); }
const inMonths = (m) => m == null ? "dans plus de 100 ans" : (() => { const d = new Date(); d.setMonth(d.getMonth() + m); return `${d.toLocaleDateString("fr-FR", { month: "long", year: "numeric" })} (${m < 24 ? m + " mois" : Math.round(m / 12) + " ans"})`; })();
const householdIncome = () => { // salaires moyens nets du foyer sur les mois complets connus
  return withProfile("foyer", () => { const D = withScope("all", budgetData), now = curMonth(); const ms = [...new Set(D.tx.map((t) => ym(t.date)))].filter((m) => m < now).sort().slice(-3);
    return ms.length ? ms.reduce((s, m) => s + D.tx.filter((t) => ym(t.date) === m && t.c === "salaire").reduce((a, t) => a + t.amount, 0), 0) / ms.length : 0; });
};

// ---- objectif patrimoine ----
function wealthCalc(g, P) {
  const cur = g.basis === "net" ? P.net : finWealth(P), av = avgSaving(), save = Math.max(0, av?.save || 0), ret = g.ret || 5;
  const m0 = monthsTo(cur, g.target, save, ret), m200 = monthsTo(cur, g.target, save + 200, ret);
  const liq = P.accRows.filter((a) => ["courant", "livret"].includes(a.type)).reduce((s, a) => s + a.value, 0), reserve = av ? (fixedCharges()?.total || av.out) * 6 : 0, excess = Math.max(0, liq - reserve - 1000);
  const mExcess = excess > 0 ? monthsTo(cur + excess * 0, g.target, save, ret) : null;
  // placer l'excédent de liquidités (1,7 %) au rendement des placements
  const mInvest = excess > 0 ? (() => { let v = cur - excess, l = excess, rr = ret / 1200, rl = 0.017 / 12; for (let m = 0; m <= 1200; m++) { if (v + l >= g.target) return m; v = v * (1 + rr) + save; l *= 1 + rl; } return null; })() : null;
  const mLiq = excess > 0 ? (() => { let v = cur - excess, l = excess, rr = ret / 1200, rl = 0.017 / 12; for (let m = 0; m <= 1200; m++) { if (v + l >= g.target) return m; v = v * (1 + rr) + save; l *= 1 + rl; } return null; })() : null;
  const horizon = g.date ? Math.max(1, Math.round((new Date(g.date) - Date.now()) / (30.44 * 864e5))) : null;
  return { cur, save, ret, m0, m200, excess, reserve, horizon, mExcess, mInvest, mLiq,
    need: horizon ? [3, 5, 7].map((r) => [r, needMonthly(cur, g.target, horizon, r)]) : [10, 15, 20, 25].map((y) => [y, needMonthly(cur, g.target, y * 12, ret)]) };
}
function sheetWealthDetail(g) {
  applyProfile(); const P = portfolio(), c = wealthCalc(g, P), pct = Math.min(100, (c.cur / g.target) * 100);
  const feeRows = P.accRows.filter((a) => isInvestType(a.type) && a.value > 0).map((a) => ({ a, f: feesOf(a) })).filter((x) => x.f.known);
  const feeBase = feeRows.reduce((s, x) => s + x.a.value, 0), feeRate = feeBase ? feeRows.reduce((s, x) => s + x.f.total, 0) / feeBase : 0;

const PTZ = {
  ceil: { A: 49000, B1: 34500, B2: 31500, C: 28500 }, // RFR max pour 1 personne, × coefficient familial
  tr: { A: [25000, 31000, 37000], B1: [21500, 26000, 30000], B2: [18000, 22500, 27000], C: [15000, 19500, 24000] }, // tranches 1 à 3 (RFR ÷ coefficient), au-delà tranche 4
  coef: [1, 1.5, 1.8, 2.1, 2.4, 2.7, 3, 3.3],
  cost: { A: [150000, 225000, 270000, 315000, 360000], B1: [135000, 202500, 243000, 283500, 324000], B2: [110000, 165000, 198000, 231000, 264000], C: [100000, 150000, 180000, 210000, 240000] },
  q: { neuf_collectif: [50, 40, 40, 20], neuf_maison: [30, 20, 20, 10], ancien_travaux: [50, 40, 40, 20] },
  dur: [[10, 15], [8, 12], [2, 13], [0, 10]], // [différé, remboursement] en années, par tranche

const IMMO_KINDS = { ancien: "Ancien", ancien_travaux: "Ancien avec gros travaux (≥ 25 %)", neuf_collectif: "Neuf, appartement", neuf_maison: "Neuf, maison" };
function ptzCalc(g) {
  const n = Math.max(1, Math.min(8, Math.round(g.persons || 2))), co = PTZ.coef[n - 1], zone = g.zone || "B1", rfr = g.rfr || 0, why = [];
  if (!g.primo) why.push("il faut ne pas avoir été propriétaire de sa résidence principale dans les 2 dernières années");
  if (g.kind === "ancien") why.push("l'ancien sans gros travaux n'est pas finançable");
  if (g.kind === "ancien_travaux" && !["B2", "C"].includes(zone)) why.push("l'ancien avec travaux n'est finançable qu'en zones B2 et C");
  if (g.kind === "ancien_travaux" && (g.works || 0) < 0.25 * ((g.price || 0) + (g.works || 0))) why.push("les travaux doivent faire au moins 25 % du coût total");
  if (!rfr) why.push("renseigne ton revenu fiscal de référence N-2 pour vérifier les plafonds");
  else if (rfr > PTZ.ceil[zone] * co) why.push(`revenu fiscal de référence au-dessus du plafond (${fE(PTZ.ceil[zone] * co)} en zone ${zone} pour ${n} personne${n > 1 ? "s" : ""})`);
  const q = rfr / co, t = q <= PTZ.tr[zone][0] ? 0 : q <= PTZ.tr[zone][1] ? 1 : q <= PTZ.tr[zone][2] ? 2 : 3;
  const base = Math.min((g.price || 0) + (g.works || 0), PTZ.cost[zone][Math.min(5, n) - 1]);
  const quot = (PTZ.q[g.kind] || [0, 0, 0, 0])[t], amount = why.length ? 0 : Math.round((base * quot) / 100);
  const [diff, remb] = PTZ.dur[t];

}
function immoCalc(g, P) {
  const years = g.years || 20, rate = g.rate || rateFor(years), ins = g.ins ?? 0.3;
  const notaryPct = g.kind && g.kind.startsWith("neuf") ? 2.5 : 7.5, notary = Math.round(((g.price || 0) * notaryPct) / 100);
  const ptz = ptzCalc(g), apport = g.apport || 0;
  let loan = Math.max(0, (g.price || 0) + (g.works || 0) + notary - apport - ptz.amount);
  const guarantee = Math.round(loan * 0.012 + 800); loan += guarantee; // caution + frais de dossier, financés
  const pay = pmtOf(loan, rate, years * 12), insM = (loan * ins) / 1200, total1 = pay + insM + (ptz.diff === 0 ? ptz.monthly : 0), totalMax = pay + insM + ptz.monthly;
  const income = g.income || householdIncome(), ratio = income ? (totalMax / income) * 100 : null;

  const interest = pay * years * 12 - loan, saved = P ? P.accRows.filter((a) => (g.accounts || []).includes(a.id)).reduce((s, a) => s + a.value, 0) : 0;

}

// ---- santé financière (avec l'épargne de précaution) ----
function healthCalc(P) {
  const av0 = avgSaving(), fx = fixedCharges(), noTx = !av0 || !(av0.out > 0);
  if (noTx && !(fx && fx.total > 0)) return null;
  // sans relevés perso : on garde l'épargne de précaution (charges fixes connues) et on laisse le taux d'épargne de côté
  const av = noTx ? { out: fx.total, rest: 0, joint: null } : av0, base = fx && fx.total > 0 ? fx.total : av.out;
  const liq = P.accRows.filter((a) => ["courant", "livret"].includes(a.type)).reduce((s, a) => s + a.value, 0), months = liq / base;
  const inc = av.out + av.rest, rate = inc > 0 ? (av.rest / inc) * 100 : 0;
  const loans = [...P.propRows.flatMap((p) => p.loans.map((l) => loanStatus(l).pmtAll * ((p.share ?? 100) / 100))), ...P.otherLoans.map((l) => l.s.pmtAll)].reduce((s, x) => s + x, 0);
  const debtR = inc > 0 ? (loans / inc) * 100 : 0;
  const tot = P.alloc.reduce((s, a) => s + a.value, 0) || 1, top = Math.max(...P.alloc.map((a) => a.value / tot)) * 100;
  const fr = P.accRows.filter((a) => isInvestType(a.type) && a.value > 0).map((a) => ({ a, f: feesOf(a) })).filter((x) => x.f.known);
  const fb = fr.reduce((s, x) => s + x.a.value, 0), fee = fb ? (fr.reduce((s, x) => s + x.f.total, 0) / fb) * 100 : null;
  const parts = [
    noTx ? { k: "Taux d'épargne", v: "relevés manquants", pts: 0, max: 0, na: true, tip: NEED_TX() } : { k: "Taux d'épargne", v: `${fP(rate, 0)}`, pts: Math.max(0, Math.min(25, (rate / 20) * 25)), max: 25, tip: `Vise 20 % : mets ${fE(Math.max(0, inc * 0.2 - av.rest))} de plus de côté par mois.` },
    { k: "Épargne de précaution", v: `${String(Math.round(months * 10) / 10).replace(".", ",")} mois`, pts: Math.max(0, Math.min(25, (months / 6) * 25)), max: 25, tone: months >= 6 ? "gain" : months >= 3 ? "warn" : "loss", tip: `Vise 6 mois de charges fixes (${fE(base * 6)}) sur tes comptes et livrets : il manque ${fE(Math.max(0, base * 6 - liq))}.` },
    { k: "Endettement", v: fP(debtR, 0), pts: debtR <= 35 ? 15 : Math.max(0, 15 - (debtR - 35)), max: 15, tip: "Garde tes mensualités sous 35 % de tes revenus." },
    { k: "Diversification", v: `${fP(top, 0)} sur une seule poche`, pts: top <= 50 ? 20 : Math.max(0, 20 - (top - 50) * 0.5), max: 20, tip: "Aucune poche ne devrait dépasser la moitié de ton patrimoine." },
    { k: "Frais", v: fee != null ? fP(fee, 2) + "/an" : "—", pts: fee == null ? 10 : fee <= 0.5 ? 15 : fee <= 1 ? 10 : fee <= 1.5 ? 5 : 0, max: 15, tip: "Privilégie les ETF et les enveloppes à frais bas (moins de 0,5 %/an)." },
  ];
  const maxT = parts.reduce((s, p) => s + p.max, 0) || 1, score = Math.round((parts.reduce((s, p) => s + p.pts, 0) / maxT) * 100);
  const worst = [...parts].filter((p) => !p.na).sort((a, b) => a.pts / a.max - b.pts / b.max)[0];
  return { score, parts, worst, months, liq, out: base, fx, joint: av.joint };
}

const chOf = () => setOf(profile).challenges || [];
function challengeCalc(c, D) {

  if (c.type === "nocat") {
    const days = Math.max(1, Math.round((new Date(Math.min(Date.now(), new Date(c.to).getTime())) - new Date(c.from)) / 864e5) + 1);
    const spent = -D.tx.filter((t) => t.c === c.cat && t.date >= c.from && t.date <= c.to).reduce((s, t) => s + t.amount, 0);
    const ms = [...new Set(D.tx.map((t) => ym(t.date)))].filter((m) => m < ym(c.from)).sort().slice(-3);
    const base = ms.length ? -D.tx.filter((t) => t.c === c.cat && ms.includes(ym(t.date))).reduce((s, t) => s + t.amount, 0) / ms.length / 30.4 : 0;
    const saved = Math.max(0, base * days - spent), done = today > c.to;

  }
  const list = D.tx.filter((t) => t.date >= c.from && t.amount < 0 && BCATS[t.c]?.[1] === "out");
  const round = list.reduce((s, t) => s + (Math.ceil(-t.amount - 1e-9) + t.amount), 0);
  return { title: "Arrondi à l'euro supérieur", status: `${fE2(round)} à virer sur ton livret · ${fE(c.total || 0)} déjà mis de côté`, ok: true, saved: round, done: false, round };

// ---- impôt sur le revenu estimé (barème 2026, revenus 2025) ----
const IR = { tr: [[11600, 0], [29579, 0.11], [84577, 0.3], [181917, 0.41], [Infinity, 0.45]], qf: 1807, decote: { s: [1982, 897], c: [3277, 1483] }, abatMin: 504, abatMax: 14426 };
function irBrut(rni, parts) { const q = rni / parts; let t = 0, lo = 0; for (const [hi, r] of IR.tr) { if (q > lo) t += (Math.min(q, hi) - lo) * r; lo = hi; } return t * parts; }
function irCalc(revs, couple, per = 0) {
  // saisie « avant abattement » (salaires) ou déjà en net imposable (comme sur l'avis d'impôt et les simulateurs en ligne)
  const net = setOf("tax").gross ? revs.map((r) => Math.max(0, r - Math.min(IR.abatMax, Math.max(IR.abatMin, r * 0.1)))) : revs.map((r) => Math.max(0, r));
  const one = (rni, parts, cpl) => { let t = irBrut(Math.max(0, rni), parts); const [lim, base] = cpl ? IR.decote.c : IR.decote.s; if (t <= lim) t = Math.max(0, t - Math.max(0, base - 0.4525 * t)); return Math.round(t); };
  const tmi = (rni, parts) => { const q = rni / parts; let r0 = 0; for (const [hi, r] of IR.tr) { r0 = r; if (q <= hi) break; } return r0; };
  if (couple) { const rni = net.reduce((a, b) => a + b, 0) - per; return { total: one(rni, 2, true), tmi: tmi(rni, 2), each: null }; }
  const each = net.map((rni, i) => one(rni - (i === 0 ? per : 0), 1, false));
  return { total: each.reduce((a, b) => a + b, 0), tmi: tmi(net[0] - per, 1), each };
}

    if (o.startValue != null) o.startDate = `${new Date().getFullYear() - 1}-12-31`;
  }
  if (kind === "holding" && !o.price) o.price = o.pru;
  if (kind === "holding" && !String(fd.get("ter") ?? "").trim()) o.ter = null;
  if (kind === "holding" && !(o.planAmount > 0)) { o.planAmount = null; o.planDay = null; }
  if (kind === "holding" && !(o.divPs > 0)) { o.divPs = null; o.divMonths = null; }
  if (kind === "holding" && o.planAmount > 0) o.planDay = Math.min(28, Math.max(1, Math.round(o.planDay || 2)));
  if (kind === "account" && !o.openedAt) o.openedAt = null;
  if (kind === "loan") { o.months = Math.round(o.years * 12); delete o.years; }
  return o;
}

/* ---------------- Sauvegarde ---------------- */
async function save(col, id, data) {
  if (!db) throw new Error("La sauvegarde n'est pas disponible dans cette vue.");
  if (id) { const { id: _drop, ...old } = S[col].find((x) => x.id === id) || {}; await db.collection(col).doc(id).set({ ...old, ...data, updatedAt: new Date().toISOString() }); }
  else return (await db.collection(col).add({ ...data, ...(["accounts", "properties", "loans"].includes(col) && profile !== "foyer" && !data.profile ? { profile } : {}), createdAt: new Date().toISOString() })).id;
}
async function remove(kind, id) {
  const col = F[kind].col;
  await db.collection(col).doc(id).delete();
  if (kind === "account") for (const h of S.holdings.filter((h) => h.accountId === id)) await db.collection("holdings").doc(h.id).delete();
  if (kind === "property") for (const l of S.loans.filter((l) => l.propertyId === id)) await db.collection("loans").doc(l.id).delete();
}

// une photo par jour et par profil (Nathan : AAAA-MM-JJ ; autres : profil_AAAA-MM-JJ)
async function snapshotToday() {
  if (snapDone || !db || !S.ready || !S.writable) return;
  snapDone = true;
  const day = new Date().toISOString().slice(0, 10), todo = [];
  for (const { k } of PROFILES) {
    applyProfile(k);
    const P = portfolio(); if (!P.assets && !P.debts) continue;
    const id = snapPrefix(k) + day, cur = R.snapshots.find((s) => s.id === id);
    if (cur && Math.round(cur.assets) === Math.round(P.assets) && Math.round(cur.debts) === Math.round(P.debts) && Math.round(cur.inv ?? -1) === Math.round(P.inv)) continue;
    todo.push([id, { assets: Math.round(P.assets), debts: Math.round(P.debts), inv: Math.round(P.inv), by: "page" }]);
  }
  applyProfile();
  for (const [id, d] of todo) { try { await db.collection("snapshots").doc(id).set(d); } catch { /* lecture seule */ } }
  recordPrices();
}
// historique des cours : collection prices, un document par position {pts: [[date, cours], ...]}, complété à chaque nouveau cours
async function recordPrices() {
  const day = new Date().toISOString().slice(0, 10);
  for (const h of R.holdings) {
    if (!(h.price > 0) || h.cls === "fonds_euro") continue;
    const d = (h.priceDate || day).slice(0, 10), doc = R.prices.find((x) => x.id === h.id), pts = doc?.pts || [];
    const last = pts[pts.length - 1];
    if (last && (last[0] >= d || (last[0] === d && last[1] === h.price))) continue;
    try { await db.collection("prices").doc(h.id).set({ pts: [...pts, [d, Math.round(h.price * 10000) / 10000]].slice(-400) }); } catch { return; }
  }
}
function holdingChart(h) {
  const pts = (R.prices.find((x) => x.id === h.id)?.pts || []).map(([d, v]) => ({ x: new Date(d).getTime(), y: v }));
  const first = pts[0], last = pts[pts.length - 1];
  const head = `<div class="panel" style="margin-bottom:14px"><div class="section-head"><h2>${esc(h.name)}</h2><span class="note">PRU ${fE(h.pru)} · cours ${fE(h.price)}</span></div>`;
  if (pts.length < 2) return head + `<p class="note">La courbe du cours se construit toute seule : chaque nouveau cours (mis à jour en semaine le soir) est gardé. Reviens dans quelques jours.</p></div>`;
  const ch = (last.y / first.y - 1) * 100, pv = (h.price - h.pru) * h.qty;
  return head + lineChart(pts, "Cours de " + h.name, h.pru) + `<div class="kv" style="margin-top:6px"><div><span>Depuis le ${new Date(first.x).toLocaleDateString("fr-FR", { day: "numeric", month: "short" })}</span><span class="${tone(ch)}">${ch >= 0 ? "+" : "−"}${fP(Math.abs(ch), 1)}</span></div><div><span>Plus-value latente</span><span class="${tone(pv)}">${sg(pv)}</span></div></div></div>`;
}

// ordinateur : regroupe les blocs de la vue en deux colonnes équilibrées (le téléphone garde une seule colonne)
const DESK = window.matchMedia("(min-width: 1100px)");
function deskLayout() {
  const v = $("#view"); if (!v || !DESK.matches) return;
  const kids = [...v.children];
  const hero = kids[0]; if (hero?.matches(".hero") && kids[1]?.matches(".grid2")) { const t = document.createElement("div"); t.className = "toprow"; hero.before(t); t.append(hero, kids[1]); }
  // en tête de vue (avant le premier bloc) : pleine largeur ; ensuite tout passe en colonnes,
  // les petits en-têtes (titre, filtres, bouton) restent collés au bloc qui les suit
  const lead = (e) => e.matches(".hero, .toprow, .seg:not(.acts), .add, div.section:not(:has(h2))");
  let started = false, glue = [];
  for (const e of [...v.children]) {
    if (!started && lead(e)) continue;
    if (e.getBoundingClientRect().height > 900) { started = true; continue; }
    started = true;
    if (e.matches(".section-head, .seg, .add, div.section:not(:has(h2))") && !e.matches("section")) { glue.push(e); continue; }
    if (glue.length) { const g = document.createElement("div"); g.className = "glue"; glue[0].before(g); g.append(...glue, e); glue = []; }
  }
  let buf = [];
  const flush = (before) => {
    if (buf.length < 2) { buf = []; return; }
    const box = document.createElement("div"); box.className = "cols"; const cs = [document.createElement("div"), document.createElement("div")], h = [0, 0];
    cs.forEach((c) => (c.className = "col"));
    const hs = buf.map((e) => e.getBoundingClientRect().height);
    if (before) before.before(box); else v.append(box);
    buf.forEach((e, i) => { const k = h[0] <= h[1] ? 0 : 1; cs[k].append(e); h[k] += hs[i] + 22; });
    box.append(...cs); buf = [];
  };
  started = false;
  for (const e of [...v.children]) { const f = (!started && lead(e)) || e.getBoundingClientRect().height > 900; if (!f) started = true; if (f) flush(e); else buf.push(e); }
  flush(null);
}

document.addEventListener("submit", async (e) => {

  if (kind === "loan") data.propertyId = parent;
  if (kind === "flow") data.accountId = parent;

    else if (back) openSheet(back); else closeSheet();
  } catch (err) { showErr(err); btn.disabled = false; btn.textContent = "Enregistrer"; }
});

async function saveMonthly(form) {
