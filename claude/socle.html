<title>Socle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout : app mobile d'abord, en-tête de patrimoine net, onglets fixés en bas, fiches en feuille glissante. */
:root {
  --bg: #f4f3ef;
  --surface: #ffffff;
  --sunk: #eceae4;
  --fg: #141b2c;
  --muted: #67708a;
  --line: #e7e4dd;
  --accent: #1f3f86;
  --gold: #b8892b;
  --gold-hi: #e9c46a;
  --hero: linear-gradient(150deg, #0a1633 0%, #17306b 55%, #24489a 100%);
  --shadow: 0 1px 2px rgb(20 28 50 / 0.04), 0 8px 24px -12px rgb(20 28 50 / 0.16);
  --panel-border: transparent;
  --accent-ink: #ffffff;
  --gain: #12805c;
  --loss: #c2410c;
  --c-liq: #8592a6;
  --c-bourse: #1f3f86;
  --c-av: #6d5bd0;
  --c-crypto: #d9822b;
  --c-immo: #c39a2f;
  --c-es: #b4497e;
  --c-autre: #a3b1ad;
  --font-display: "Sora", ui-sans-serif, system-ui, sans-serif;
  --font-body: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0e17; --surface: #121826; --sunk: #1a2132; --fg: #e8ecf4; --muted: #98a2b6; --line: #232c3e;
    --hero: linear-gradient(150deg, #070f24 0%, #132a5e 58%, #1e3f86 100%); --gold: #e2bc5c; --gold-hi: #f0d488; --shadow: none; --panel-border: #1f2738;
    --accent: #8fb0ff; --accent-ink: #0a1633; --gain: #4ade9b; --loss: #fb8b4b;
    --c-liq: #98a5ba; --c-bourse: #8fb0ff; --c-av: #a395f2; --c-crypto: #f0a35a; --c-immo: #e2bc5c; --c-es: #e07fb0; --c-autre: #5d6f6b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0e17; --surface: #121826; --sunk: #1a2132; --fg: #e8ecf4; --muted: #98a2b6; --line: #232c3e;
    --hero: linear-gradient(150deg, #070f24 0%, #132a5e 58%, #1e3f86 100%); --gold: #e2bc5c; --gold-hi: #f0d488; --shadow: none; --panel-border: #1f2738;
  --accent: #8fb0ff; --accent-ink: #0a1633; --gain: #4ade9b; --loss: #fb8b4b;
  --c-liq: #98a5ba; --c-bourse: #8fb0ff; --c-av: #a395f2; --c-crypto: #f0a35a; --c-immo: #e2bc5c; --c-es: #e07fb0; --c-autre: #5d6f6b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  font-variant-numeric: tabular-nums;
}
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(92px + env(safe-area-inset-bottom, 0px));
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 15px; font-weight: 600; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand b { font-family: var(--font-display); font-size: 17px; display: flex; align-items: center; gap: 8px; }
.brand svg { width: 16px; height: 16px; }
.status { font-size: 12px; color: var(--muted); }
.hero { padding-block: 22px 18px; display: grid; gap: 4px; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.big { font-family: var(--font-display); font-size: clamp(34px, 9vw, 46px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
.sub { color: var(--muted); font-size: 13px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 640px) { .grid4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; min-width: 0; }
.tile .k { font-size: 12px; color: var(--muted); }
.tile .v { font-family: var(--font-display); font-size: 19px; font-weight: 600; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .s { font-size: 12px; color: var(--muted); }
.section { margin-top: 22px; display: grid; gap: 10px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.section-head .total { font-weight: 600; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.alloc { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 16px; align-items: center; }
@media (max-width: 520px) { .alloc { grid-template-columns: 1fr; justify-items: center; } }
.legend { display: grid; gap: 8px; width: 100%; font-size: 14px; }
.legend div { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
.legend div > span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 3px; }
.pct { color: var(--muted); font-size: 12px; min-width: 42px; text-align: right; }
.list { display: grid; }
.row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center;
  padding: 11px 2px; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0;
  color: inherit; font: inherit; text-align: left; width: 100%; cursor: pointer;
}
.row:first-child { border-top: 0; }
.row:hover .name { color: var(--accent); }
.row .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .amt { text-align: right; font-weight: 600; white-space: nowrap; }
.row .amt small { display: block; font-weight: 500; font-size: 12px; }
.gain { color: var(--gain); } .loss { color: var(--loss); }
.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 99px; background: var(--sunk); color: var(--muted); }
.btn {
  appearance: none; border: 0; border-radius: 11px; padding: 11px 16px; font: 600 14px var(--font-body);
  background: var(--accent); color: var(--accent-ink); cursor: pointer;
}
.btn.ghost { background: var(--sunk); color: var(--fg); }
.btn.danger { background: transparent; color: var(--loss); border: 1px solid currentColor; }
.btn:focus-visible, .row:focus-visible, .tab:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.add { width: 100%; }
.empty { text-align: center; color: var(--muted); padding: 22px 8px; font-size: 14px; }
.empty .btn { margin-top: 12px; }
.note { font-size: 12px; color: var(--muted); }
.bar { height: 6px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.kv { display: grid; }
.kv div { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: 14px; }
.kv div span:first-child { color: var(--muted); }
.kv .strong { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 9px; font-weight: 600; }
.kv .strong span:first-child { color: var(--fg); }
svg text { fill: var(--muted); font-family: var(--font-body); font-size: 10px; }

/* Onglets fixés en bas */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tabs nav { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { appearance: none; background: none; border: 0; color: var(--muted); font: 500 12px var(--font-body); padding: 10px 4px 9px; display: grid; justify-items: center; gap: 3px; cursor: pointer; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); }

/* Feuille (formulaires et fiches) */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / 0.35); z-index: 30; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-height: 92%; overflow-y: auto;
  background: var(--bg); border-radius: 20px 20px 0 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px calc(20px + env(safe-area-inset-bottom, 0px));
}
@media (min-width: 800px) { .sheet { left: 50%; width: 720px; transform: translateX(-50%); } }
.grab { width: 38px; height: 5px; border-radius: 99px; background: var(--line); margin: 0 auto 12px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.sheet-head h2 { font-size: 19px; }
.x { appearance: none; border: 0; background: var(--sunk); color: var(--fg); width: 32px; height: 32px; border-radius: 99px; font-size: 18px; cursor: pointer; flex: none; }
form.f { display: grid; gap: 14px; }
fieldset { border: 0; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
legend { grid-column: 1 / -1; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 0; margin-bottom: 8px; }
label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
label.full { grid-column: 1 / -1; }
input, select {
  width: 100%; font: 16px var(--font-body); color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px; min-width: 0;
}
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions .btn { flex: 1 1 140px; }
.err { color: var(--loss); font-size: 13px; }
.upd { display: grid; grid-template-columns: minmax(0, 1fr) 130px; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.upd:first-of-type { border-top: 0; }
.upd .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.upd input { text-align: right; }
.upd input.changed { border-color: var(--accent); }
.seg { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; margin-inline: -2px; }
.seg::-webkit-scrollbar { display: none; }
.seg-b { appearance: none; flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 99px; padding: 7px 13px; font: 500 14px var(--font-body); cursor: pointer; }
.seg-b span { color: var(--muted); font-size: 12px; }
.seg-b[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.seg-b[aria-selected="true"] span { color: inherit; opacity: 0.7; }
.seg-b:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.head-btns { display: flex; gap: 8px; align-items: center; flex: none; }
.btn.sm { padding: 7px 12px; font-size: 13px; }
.todo { background: var(--surface); border: 1px dashed var(--accent); border-radius: var(--r); padding: 12px 14px; margin-bottom: 12px; display: grid; gap: 8px; font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { appearance: none; border: 1px solid var(--line); background: var(--sunk); color: var(--fg); border-radius: 99px; padding: 5px 11px; font: 500 13px var(--font-body); cursor: pointer; }
.chip::before { content: "+ "; color: var(--accent); font-weight: 700; }
.monthly { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.banner { background: var(--sunk); border-radius: 12px; padding: 10px 12px; font-size: 13px; color: var(--muted); margin-top: 12px; }

/* ---- Habillage 2 : cartes douces, en-tête en dégradé, analyses repliables ---- */
.panel, .tile { border-color: var(--panel-border); box-shadow: var(--shadow); }
.tile { padding: 14px 15px; }
.tile .v { font-size: 20px; letter-spacing: -0.02em; }
.hero { position: relative; overflow: hidden; margin-top: 14px; padding: 22px 20px 0; border-radius: 24px; background: var(--hero); color: #fff; box-shadow: 0 18px 40px -22px rgb(15 35 90 / 0.75); }
.hero::after { content: ""; position: absolute; right: -60px; top: -80px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(closest-side, rgb(233 196 106 / 0.22), transparent); pointer-events: none; }
.hero .eyebrow, .hero .sub { color: rgb(255 255 255 / 0.78); }
.hero .big { color: #fff; }
.hero .sub { padding-bottom: 20px; }
.hero .sub .gain, .hero .sub .loss { color: #fff; }
.hero:has(.spark) .sub { padding-bottom: 6px; }
.chip-d { display: inline-block; padding: 2px 9px; border-radius: 99px; background: rgb(233 196 106 / 0.18); color: var(--gold-hi) !important; font-weight: 600; margin-right: 4px; }
.hero .eyebrow { color: var(--gold-hi); }
.hero::before { content: ""; position: absolute; left: 20px; right: 20px; top: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--gold-hi), transparent); opacity: 0.7; }
.bar > i { background: linear-gradient(90deg, var(--accent), var(--gold)); }
.tab[aria-current="page"] svg { color: var(--gold); }
.spark { display: block; width: calc(100% + 40px); height: 56px; margin: 4px -20px 0; }
.section { margin-top: 26px; }
h2 { font-size: 16px; }
.h-lg { font-size: 19px; }
.row { padding: 13px 2px; }
.row.with-av { grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; }
.av { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; font: 600 15px var(--font-display); color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
.row .amt small.gain, .row .amt small.loss { font-weight: 600; }
.legend div { padding: 2px 0; }
.dot { border-radius: 99px; }
details.fold { background: var(--surface); border: 1px solid var(--panel-border); border-radius: var(--r); box-shadow: var(--shadow); padding: 0 14px; margin-top: 12px; gap: 10px; }
details.fold > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto 18px; gap: 10px; align-items: center; padding: 15px 0; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg) translate(-2px, -2px); justify-self: center; transition: transform 0.2s; }
details.fold[open] > summary::after { transform: rotate(-135deg) translate(-2px, -2px); }
details.fold > summary b { font: 600 16px var(--font-display); white-space: nowrap; }
details.fold > summary b small { font: 500 12px var(--font-body); color: var(--muted); }
.fold-t { display: grid; gap: 2px; min-width: 0; }
.fold-t h2 { font-size: 15px; }
details.fold[open] { padding-bottom: 14px; }
details.fold .panel { box-shadow: none; border: 1px solid var(--line); }
details.fold > .section-head { margin-top: 6px; }
.monthly { background: var(--sunk); box-shadow: none; }
.seg-b { border-color: var(--line); background: var(--surface); }
.seg-b[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn { border-radius: 14px; }
.tabs { left: 50%; right: auto; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(480px, calc(100% - 16px)); border: 1px solid var(--line); border-radius: 22px; padding: 4px; box-shadow: 0 12px 32px -14px rgb(0 0 0 / 0.35); background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4); }
.tab { border-radius: 18px; padding: 8px 4px 7px; font-size: 11px; }
.tab[aria-current="page"] { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.wrap { padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
.brand b svg { width: 18px; height: 18px; }
.profiles { display: flex; gap: 6px; margin-top: 14px; padding: 4px; background: var(--sunk); border-radius: 16px; }
.prof { appearance: none; flex: 1 1 0; min-width: 0; border: 0; background: none; color: var(--muted); font: 600 13px var(--font-body); padding: 8px 6px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer; white-space: nowrap; }
.prof .av-s { width: 22px; height: 22px; border-radius: 8px; display: grid; place-items: center; font: 700 11px var(--font-display); background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); flex: none; }
.prof[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.prof[aria-selected="true"] .av-s { background: var(--gold); color: #fff; }
.prof:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.head-r { display: flex; align-items: center; gap: 10px; min-width: 0; }
.head-r .status { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.eye { appearance: none; flex: none; width: 36px; height: 36px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); display: grid; place-items: center; cursor: pointer; box-shadow: var(--shadow); }
.eye svg { width: 19px; height: 19px; }
.eye[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.eye:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hero + .grid2, .hero + .panel, .hero + .seg { margin-top: 14px; }
.kv .strong:first-child { border-top: 0; margin-top: 0; padding-top: 6px; }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up 0.22s ease-out; }
  @keyframes up { from { transform: translateY(24px); } }
  @media (min-width: 800px) { @keyframes up { from { transform: translate(-50%, 24px); } } }
}
/* Budget */
.budget-hero .mnav { display: flex; align-items: center; gap: 6px; margin-left: -6px; }
.mbtn { appearance: none; border: 0; background: rgb(255 255 255 / 0.12); color: #fff; width: 28px; height: 28px; border-radius: 99px; font-size: 17px; line-height: 1; cursor: pointer; }
.mbtn:disabled { opacity: 0.3; cursor: default; }
.budget-hero .eyebrow { text-transform: none; letter-spacing: 0; font-size: 14px; }
.cats { display: grid; gap: 2px; padding-block: 8px; }
.catrow { appearance: none; background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; column-gap: 10px; row-gap: 6px; align-items: center; padding: 8px 4px; border-radius: 10px; }
.catrow .bar { grid-column: 2 / -1; height: 5px; }
.catrow .cn { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.catrow .cn small, .catrow .cv small { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
.catrow .cv { text-align: right; font-weight: 600; font-size: 14px; }
.catrow[aria-pressed="true"] { background: var(--sunk); }
.dayh { font-size: 12px; color: var(--muted); padding: 12px 2px 2px; text-transform: capitalize; }
.dayh:first-child { padding-top: 0; }
.dayh + .row { border-top: 0; }
.txl { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 10px; align-items: center; min-width: 0; }
label.chk { display: flex; gap: 8px; align-items: flex-start; color: var(--fg); font-size: 13px; }
label.chk input { width: auto; margin-top: 2px; }
.section .actions .btn.sm { flex: 0 0 auto; }
</style>

<div class="wrap">
  <header class="brand">
    <b><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 15 14.5H1z" fill="var(--gold)"/></svg>Socle</b>
    <span class="head-r"><span class="status" id="status">Chargement…</span><button class="eye" id="eye" type="button" aria-pressed="false" aria-label="Masquer les montants" title="Masquer les montants"></button></span>
  </header>
  <div class="profiles" id="profiles" role="tablist" aria-label="Profil"></div>
  <main id="view"></main>
</div>

<div class="tabs">
  <nav aria-label="Sections">
    <button class="tab" data-tab="synthese"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V10M10 19V5M16 19v-7M21 19H3"/></svg>Synthèse</button>
    <button class="tab" data-tab="comptes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 15h4"/></svg>Comptes</button>
    <button class="tab" data-tab="positions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 18 9 12l4 3 7-8"/><path d="M15 7h5v5"/></svg>Positions</button>
    <button class="tab" data-tab="immobilier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11 12 4l9 7M5.5 9.5V20h13V9.5M10 20v-5h4v5"/></svg>Immobilier</button>
    <button class="tab" data-tab="budget"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18v4"/><rect x="3.5" y="8" width="17" height="11" rx="2.5"/><path d="M16 13.5h1.5"/></svg>Budget</button>
  </nav>
</div>

<div id="sheet-root"></div>

<script>
/* ---------------- Référentiels ---------------- */
const ACCOUNT_TYPES = { courant: "Compte courant", livret: "Livret / épargne", pea: "PEA", cto: "Compte-titres", assurance_vie: "Assurance-vie", per: "PER", epargne_salariale: "Épargne salariale", crypto: "Crypto", autre: "Autre" };
const ASSET_CLASSES = { action: "Action", etf: "ETF", fonds: "Fonds / OPCVM", obligation: "Obligation", crypto: "Crypto", fonds_euro: "Fonds euros", autre: "Autre" };
const PROPERTY_TYPES = { residence_principale: "Résidence principale", locatif: "Locatif", secondaire: "Résidence secondaire", scpi: "SCPI" };
const SLICES = [
  { key: "liq", label: "Liquidités", types: ["courant", "livret"] },
  { key: "bourse", label: "Bourse", types: ["pea", "cto"] },
  { key: "av", label: "Assurance-vie / PER", types: ["assurance_vie", "per"] },
  { key: "es", label: "Épargne salariale", types: ["epargne_salariale"] },
  { key: "crypto", label: "Crypto", types: ["crypto"] },
  { key: "immo", label: "Immobilier", types: [] },
  { key: "autre", label: "Autre", types: ["autre"] },
];

/* ---------------- Format ---------------- */
const eur0 = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
const eur2 = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", minimumFractionDigits: 2, maximumFractionDigits: 2 });
// mode discret : montants masqués, pourcentages visibles (préférence gardée sur cet appareil)
let discret = false; try { discret = localStorage.getItem("socle-discret") === "1"; } catch { }
const HID = "•••\u202f€";
const fE = (v) => discret ? HID : eur0.format(v || 0);
const fE2 = (v) => discret ? HID : eur2.format(v || 0);
const fU = (v) => eur2.format(v || 0); // prix unitaire : public, toujours visible
const fQ = (q) => discret ? "•••" : q.toLocaleString("fr-FR", { maximumFractionDigits: 6 });
const fP = (v, d = 2) => (v < 0 ? "−" : "") + Math.abs(v || 0).toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d }) + " %";
const tone = (v) => (v >= 0 ? "gain" : "loss");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (v) => { const n = Number(String(v ?? "").replace(/\s/g, "").replace(",", ".")); return Number.isFinite(n) ? n : 0; };

/* ---------------- Calculs ---------------- */
function monthlyPayment(P, ratePct, n) {
  const r = ratePct / 100 / 12;
  if (n <= 0) return 0;
  return r === 0 ? P / n : (P * r) / (1 - Math.pow(1 + r, -n));
}
function paidMonths(start, at = new Date()) {
  const s = new Date(start);
  if (isNaN(s)) return 0;
  const m = (at.getFullYear() - s.getFullYear()) * 12 + (at.getMonth() - s.getMonth());
  return Math.max(0, m + (at.getDate() >= s.getDate() ? 0 : -1));
}
function amortization(l) {
  const pmt = monthlyPayment(l.principal, l.rate, l.months), r = l.rate / 100 / 12, s = new Date(l.start);
  let rem = l.principal; const rows = [];
  for (let n = 1; n <= l.months; n++) {
    const interest = rem * r, princ = Math.min(pmt - interest, rem);
    rem = Math.max(0, rem - princ);
    rows.push({ n, year: new Date(s.getFullYear(), s.getMonth() + n, 1).getFullYear(), interest, remaining: rem });
  }
  return rows;
}
function loanStatus(l) {
  const rows = amortization(l), paid = Math.min(paidMonths(l.start), l.months);
  const remaining = paid === 0 ? l.principal : rows[paid - 1].remaining;
  const pmt = monthlyPayment(l.principal, l.rate, l.months);
  const totalInterest = rows.reduce((a, r) => a + r.interest, 0);
  const s = new Date(l.start), end = new Date(s.getFullYear(), s.getMonth() + l.months, 1);
  return {
    rows, paid, remaining, pmt, pmtAll: pmt + (l.insurance || 0), totalInterest,
    interestPaid: rows.slice(0, paid).reduce((a, r) => a + r.interest, 0),
    next12Interest: rows.slice(paid, paid + 12).reduce((a, r) => a + r.interest, 0),
    totalCost: totalInterest + (l.insurance || 0) * l.months,
    progress: l.principal ? (1 - remaining / l.principal) * 100 : 0,
    end: end.toLocaleDateString("fr-FR", { month: "short", year: "numeric" }),
  };
}
function propertyMetrics(p, loans) {
  const share = (p.share ?? 100) / 100;
  const cost = (p.price || 0) + (p.notary || 0) + (p.works || 0);
  const rent = (p.rent || 0) * 12, effRent = rent * (1 - (p.vacancy || 0) / 100);
  const mgmt = effRent * ((p.mgmt || 0) / 100);
  const expenses = (p.charges || 0) * 12 + (p.tax || 0) + (p.pno || 0) + mgmt;
  const net = effRent - expenses;
  const st = loans.map(loanStatus);
  const debt100 = st.reduce((a, s) => a + s.remaining, 0);
  const monthlyLoan = st.reduce((a, s) => a + s.pmtAll, 0);
  // apport personnel via une société (capital + compte courant d'associé) : compté une fois l'acte passé
  const apport = (p.capital || 0) + (p.cca || 0), apportLive = apport > 0 && p.bought && new Date(p.bought) <= new Date() ? apport : 0;
  const equity = ((p.value || 0) - debt100) * share;
  return {
    apport, apportLive,
    cost, rent, effRent, mgmt, expenses, net, monthlyLoan,
    next12Interest: st.reduce((a, s) => a + s.next12Interest, 0),
    gross: cost ? (rent / cost) * 100 : 0, netYield: cost ? (net / cost) * 100 : 0,
    cashflow: net / 12 - monthlyLoan, myCashflow: (net / 12 - monthlyLoan) * share,
    value: (p.value || 0) * share, debt: debt100 * share, equity: equity + apportLive,
    gain: apport ? equity : ((p.value || 0) - cost) * share,
    gainPct: apport ? (equity / apport) * 100 : cost ? (((p.value || 0) - cost) / cost) * 100 : 0,
    sqm: p.surface ? (p.value || 0) / p.surface : null,
  };
}

/* ---------------- État ---------------- */
const S = { accounts: [], holdings: [], properties: [], loans: [], snapshots: [], flows: [], ready: false, writable: true };
const COLS = ["accounts", "holdings", "properties", "loans", "snapshots", "flows", "tx", "rules"];
// profils : chaque compte / bien porte `profile` (absent = nathan). R garde tout, S ne montre que le profil choisi.
const PROFILES = [{ k: "nathan", label: "Nathan" }, { k: "angelique", label: "Angélique" }, { k: "foyer", label: "Foyer" }];
const R = { accounts: [], holdings: [], properties: [], loans: [], snapshots: [], flows: [], tx: [], rules: [] };
let profile = "nathan"; try { const v = localStorage.getItem("socle-profil"); if (PROFILES.some((p) => p.k === v)) profile = v; } catch { }
const ownerOf = (x) => x.profile || "nathan";
const snapPrefix = (k) => (k === "nathan" ? "" : k + "_");
function applyProfile(k = profile) {
  const mine = (x) => k === "foyer" || ownerOf(x) === k;
  S.accounts = R.accounts.filter(mine);
  const ids = new Set(S.accounts.map((a) => a.id));
  S.holdings = R.holdings.filter((h) => ids.has(h.accountId));
  S.flows = R.flows.filter((f) => ids.has(f.accountId));
  S.properties = R.properties.filter(mine);
  const pids = new Set(S.properties.map((p) => p.id));
  S.loans = R.loans.filter((l) => (l.propertyId ? pids.has(l.propertyId) : mine(l)));
  const pre = snapPrefix(k);
  S.snapshots = R.snapshots.filter((x) => (pre ? x.id.startsWith(pre) : /^\d{4}-\d{2}-\d{2}$/.test(x.id))).map((x) => ({ ...x, id: x.id.slice(pre.length) }));
}
const isInvestType = (t) => !["courant", "livret"].includes(t);
let histRange = "all", histSeries = "net";
let db = null, tab = "synthese", sheet = null;

function portfolio() {
  const accRows = S.accounts.map((a) => {
    const hs = S.holdings.filter((h) => h.accountId === a.id);
    return { ...a, hs, value: (a.cash || 0) + hs.reduce((s, h) => s + h.qty * h.price, 0) };
  });
  const propRows = S.properties.map((p) => ({ ...p, loans: S.loans.filter((l) => l.propertyId === p.id), m: propertyMetrics(p, S.loans.filter((l) => l.propertyId === p.id)) }));
  const otherLoans = S.loans.filter((l) => !l.propertyId || !S.properties.some((p) => p.id === l.propertyId)).map((l) => ({ ...l, s: loanStatus(l) }));
  const alloc = SLICES.map((sl) => ({
    ...sl,
    value: sl.key === "immo" ? propRows.reduce((s, p) => s + p.m.value + p.m.apportLive, 0) : accRows.filter((a) => sl.types.includes(a.type)).reduce((s, a) => s + a.value, 0),
  })).filter((s) => s.value > 0);
  const assets = alloc.reduce((s, x) => s + x.value, 0);
  const debts = propRows.reduce((s, p) => s + p.m.debt, 0) + otherLoans.reduce((s, l) => s + l.s.remaining, 0);
  const inv = accRows.filter((a) => isInvestType(a.type)).reduce((s, a) => s + a.value, 0);
  return { accRows, propRows, otherLoans, alloc, assets, debts, inv, net: assets - debts };
}

/* ---------------- Graphiques SVG ---------------- */
function donut(alloc) {
  const total = alloc.reduce((s, a) => s + a.value, 0) || 1, R = 54, C = 2 * Math.PI * R;
  let off = 0;
  const arcs = alloc.map((a) => {
    const len = (a.value / total) * C, gap = alloc.length > 1 ? 2 : 0;
    const el = `<circle r="${R}" cx="66" cy="66" fill="none" stroke="var(--c-${a.key})" stroke-width="20" stroke-dasharray="${Math.max(0, len - gap)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 66 66)"/>`;
    off += len; return el;
  }).join("");
  return `<svg viewBox="0 0 132 132" width="132" height="132" role="img" aria-label="Répartition du patrimoine">${arcs}</svg>`;
}
function spark(ys) {
  if (ys.length < 2) return "";
  const W = 300, H = 46, min = Math.min(...ys), max = Math.max(...ys), r = max - min || 1;
  const pts = ys.map((y, i) => [(i / (ys.length - 1)) * W, 4 + (1 - (y - min) / r) * (H - 8)]);
  const d = pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join("");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}L${W},${H}L0,${H}Z" fill="url(#sg)"/><defs><linearGradient id="sg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e9c46a" stop-opacity=".3"/><stop offset="1" stop-color="#e9c46a" stop-opacity="0"/></linearGradient></defs><path d="${d}" fill="none" stroke="#e9c46a" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}
function lineChart(points, label) {
  if (points.length < 2) return `<p class="note">La courbe se construit toute seule : une photo de ton patrimoine net est enregistrée chaque jour où tu ouvres Socle.</p>`;
  const W = 320, H = 130, pl = 44, pr = 8, pt = 10, pb = 20;
  const ys = points.map((p) => p.y), min = Math.min(...ys), max = Math.max(...ys);
  const step = niceStep((max - min) / 3 || Math.abs(max) / 4 || 1000);
  const lo = Math.floor(min / step) * step, hi = Math.max(lo + step, Math.ceil(max / step) * step);
  const t0 = points[0].x, t1 = points[points.length - 1].x || t0 + 1;
  const X = (x) => pl + ((x - t0) / (t1 - t0 || 1)) * (W - pl - pr), Y = (y) => pt + (1 - (y - lo) / (hi - lo)) * (H - pt - pb);
  let grid = "";
  for (let v = lo; v <= hi + 1e-6; v += step) grid += `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${pl - 6}" y="${Y(v) + 3}" text-anchor="end">${discret ? "" : (v / 1000).toLocaleString("fr-FR", { maximumFractionDigits: step < 1000 ? 1 : 0 }) + " k€"}</text>`;
  const d = points.map((p, i) => `${i ? "L" : "M"}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
  const area = `${d}L${X(t1)},${H - pb}L${X(t0)},${H - pb}Z`;
  const fmt = (t) => new Date(t).toLocaleDateString("fr-FR", { month: "short", year: "2-digit" });
  const last = points[points.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(label)}">
    <defs><linearGradient id="lg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${area}" fill="url(#lg)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(last.x)}" cy="${Y(last.y)}" r="3.5" fill="var(--accent)"/>
    <text x="${pl}" y="${H - 4}">${fmt(t0)}</text><text x="${W - pr}" y="${H - 4}" text-anchor="end">${fmt(t1)}</text></svg>`;
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(Math.abs(raw) || 1))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }

/* ---------------- Vues ---------------- */
const tile = (k, v, s = "", cls = "") => `<div class="tile"><div class="k">${k}</div><div class="v ${cls}">${v}</div>${s ? `<div class="s">${s}</div>` : ""}</div>`;

function viewSynthese(P) {
  if (!S.accounts.length && !S.properties.length) return `
    <section class="hero"><div class="eyebrow">Patrimoine net</div><div class="big">${fE(0)}</div></section>
    <div class="panel empty">Ajoute ton premier compte ou ton premier bien pour voir ton patrimoine.<br>
      <button class="btn" data-act="new-account">Ajouter un compte</button> <button class="btn ghost" data-act="new-property">Ajouter un bien</button></div>`;
  const rental = P.propRows.filter((p) => p.type !== "residence_principale");
  const cf = rental.reduce((s, p) => s + p.m.myCashflow, 0);
  const allSnaps = S.snapshots.filter((s) => /^\d{4}-\d{2}-\d{2}$/.test(s.id)).sort((a, b) => a.id.localeCompare(b.id));
  const snaps = histSeries === "inv" ? allSnaps.filter((s) => s.inv != null) : allSnaps.filter((s) => s.assets != null);
  const allHist = snaps.map((s) => ({ x: new Date(s.id).getTime(), y: histSeries === "inv" ? s.inv : s.assets - s.debts }));
  const netSnaps = allSnaps.filter((s) => s.assets != null), first = netSnaps.length ? { x: new Date(netSnaps[0].id).getTime(), y: netSnaps[0].assets - netSnaps[0].debts } : null, delta = first ? P.net - first.y : 0;
  const days = { "1m": 31, "3m": 92, "1a": 366 }[histRange];
  const hist = days ? allHist.filter((p) => p.x >= Date.now() - days * 864e5) : allHist;
  const dec = histSeries === "inv" ? null : decomposition(P, snaps.length ? snaps[0] : null, hist.length ? snaps.find((s) => new Date(s.id).getTime() === hist[0].x) : null);
  return `
  <section class="hero">
    <div class="eyebrow">Patrimoine net</div>
    <div class="big">${fE(P.net)}</div>
    ${first && netSnaps.length > 1 ? `<div class="sub"><span class="chip-d ${tone(delta)}">${delta >= 0 ? "▲ +" : "▼ −"}${discret && first.y ? fP(Math.abs(delta / first.y) * 100, 1) : fE(Math.abs(delta))}</span> depuis le ${new Date(first.x).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" })}</div>` : ""}
    ${spark(netSnaps.map((s) => s.assets - s.debts))}
  </section>
  <div class="grid2 grid4">
    ${tile("Patrimoine brut", fE(P.assets))}
    ${tile("Dettes", fE(P.debts), P.assets ? "Endettement " + fP((P.debts / P.assets) * 100, 1) : "")}
    ${tile("Cash-flow locatif", fE(cf) + "<small style='font-size:12px;font-weight:500'> /mois</small>", rental.length ? "Loyers " + fE(rental.reduce((s, p) => s + p.m.rent, 0)) + " / an" : "Aucun bien locatif", rental.length ? tone(cf) : "")}
    ${tile("Plus-values latentes", fE(P.accRows.reduce((s, a) => s + a.hs.reduce((t, h) => t + h.qty * (h.price - h.pru), 0), 0)), "Bourse et crypto", tone(P.accRows.reduce((s, a) => s + a.hs.reduce((t, h) => t + h.qty * (h.price - h.pru), 0), 0)))}
  </div>
  <div class="section"><div class="panel monthly"><span><b>Mise à jour du mois</b><div class="note">${lastUpdateText()}</div></span><button class="btn" data-act="monthly">Mettre à jour</button></div></div>
  <section class="section">
    <h2>Répartition</h2>
    <div class="panel alloc">${donut(P.alloc)}<div class="legend">${P.alloc.map((a) => `<div><span class="dot" style="background:var(--c-${a.key})"></span><span>${a.label}</span><span class="pct">${fP((a.value / P.assets) * 100, 1)}</span><b>${fE(a.value)}</b></div>`).join("")}</div></div>
  </section>
  <section class="section">
    <div class="section-head"><h2>Évolution du patrimoine net</h2></div>
    <div class="seg" role="tablist" aria-label="Série" style="margin-bottom:8px">${[["net", "Patrimoine net"], ["inv", "Placements"]].map(([k, l]) => `<button role="tab" class="seg-b" aria-selected="${histSeries === k}" data-series="${k}">${l}</button>`).join("")}</div>
    <div class="seg" role="tablist" aria-label="Période" style="margin-bottom:10px">${[["1m", "1 mois"], ["3m", "3 mois"], ["1a", "1 an"], ["all", "Tout"]].map(([k, l]) => `<button role="tab" class="seg-b" aria-selected="${histRange === k}" data-range="${k}">${l}</button>`).join("")}</div>
    <div class="panel">${lineChart(hist, histSeries === "inv" ? "Évolution des placements" : "Évolution du patrimoine net")}${histSeries === "inv" ? `<p class="note" style="margin-top:6px">Valeur de tes placements (PEA, CTO, assurance-vie, épargne salariale), versements compris.</p>` : ""}</div>
    ${dec ? `<div class="panel kv" style="margin-top:10px">
      <div class="strong"><span>Variation depuis le ${dec.from}</span><span class="${tone(dec.total)}">${sg(dec.total)}</span></div>
      <div><span>Performance des placements</span><span class="${tone(dec.market)}">${sg(dec.market)}${dec.marketPct != null ? ` · ${dec.marketPct >= 0 ? "+" : ""}${fP(dec.marketPct, 1)}` : ""}</span></div>
      <div><span>Épargne, versements et crédit remboursé</span><span class="${tone(dec.saved)}">${sg(dec.saved)}</span></div>
      <div><span class="note">Versements notés sur tes placements : ${fE(dec.flows)}. La performance = variation des placements moins ces versements.</span></div>
    </div>` : ""}
  </section>
  <div class="section-head" style="margin-top:28px"><h2 class="h-lg">Analyses</h2><span class="note">touche pour déplier</span></div>
  ${ytdTable(P)}
  ${costTable(P)}
  ${feesTable(P)}`;
}
// ce que tu as mis (prix d'achat, PRU, apport) face à ce que ça vaut aujourd'hui
function costTable(P) {
  const rows = [];
  for (const a of P.accRows.filter((a) => isInvestType(a.type) && a.value > 0).sort((x, y) => y.value - x.value)) {
    const dep = a.deposits != null;
    const cost = dep ? a.deposits - (a.withdrawals || 0) : (a.cash || 0) + a.hs.reduce((s, h) => s + h.qty * h.pru, 0);
    rows.push({ base: dep ? a.deposits : null, name: a.name, sub: dep ? `versé ${fE(a.deposits)}${a.withdrawals ? ", retiré " + fE(a.withdrawals) : ""}` : ACCOUNT_TYPES[a.type], cost, value: a.value, act: `data-act="open-account" data-id="${a.id}"` });
  }
  for (const p of P.propRows) {
    const m = p.m, share = (p.share ?? 100) / 100;
    if (m.apport) rows.push({ name: p.name, sub: "ton apport", cost: m.apport, value: m.apport + m.gain, act: `data-act="open-property" data-id="${p.id}"` });
    else rows.push({ name: p.name, sub: "prix + frais + travaux", cost: m.cost * share, value: m.value, act: `data-act="open-property" data-id="${p.id}"` });
  }
  const liq = P.accRows.filter((a) => !isInvestType(a.type)).reduce((s, a) => s + a.value, 0);
  if (liq) rows.push({ name: "Liquidités", sub: "comptes courants et livrets", cost: liq, value: liq, act: `data-tab="comptes"` });
  if (!rows.length) return "";
  const tc = rows.reduce((s, r) => s + r.cost, 0), tv = rows.reduce((s, r) => s + r.value, 0);
  const pct = (v, c) => (c ? `${v >= c ? "+" : ""}${fP(((v - c) / c) * 100, 1)}` : "");
  return `<details class="section fold"><summary><span class="fold-t"><h2>Acheté ou investi, face à la valeur</h2><span class="note">mis ${fE(tc)} · vaut ${fE(tv)}</span></span><b class="${tone(tv - tc)}">${sg(tv - tc)}</b></summary>
    <div class="panel list">${rows.map((r) => `<button class="row" ${r.act}><span><div class="name">${esc(r.name)}</div><div class="meta">${esc(r.sub)} · mis ${fE(r.cost)}</div></span>
      <span class="amt">${fE(r.value)}<small class="${tone(r.value - r.cost)}">${sg(r.value - r.cost)}${r.cost !== r.value ? " · " + (r.base ? `${r.value - r.cost >= 0 ? "+" : ""}${fP(((r.value - r.cost) / r.base) * 100, 1)} du versé` : pct(r.value, r.cost)) : ""}</small></span></button>`).join("")}
      <div class="row"><span><div class="name"><b>Total</b></div><div class="meta">mis ${fE(tc)}</div></span><span class="amt"><b>${fE(tv)}</b><small class="${tone(tv - tc)}">${sg(tv - tc)} · ${pct(tv, tc)}</small></span></div>
    </div><p class="note" style="margin-top:6px">Placements : versements moins retraits quand on les connaît, sinon PRU × quantité plus les liquidités du compte. Le bien en SCI compte ton apport face à ta part (valeur moins crédit, plus ton apport).</p></details>`;
}
// frais annuels : frais courants des fonds (ter) + frais de l'enveloppe (feeUC / feeEuro), en € par an
function feesOf(a) {
  let fund = 0, envF = 0, unknown = 0;
  const lines = [];
  for (const h of a.hs) {
    const v = h.qty * h.price, euro = h.cls === "fonds_euro", isFund = ["fonds", "etf", "obligation"].includes(h.cls);
    const ter = euro || !isFund ? 0 : h.ter;
    if (ter == null) unknown++;
    const e = v * ((euro ? a.feeEuro : a.feeUC) || 0) / 100, f = v * (ter || 0) / 100;
    fund += f; envF += e;
    lines.push({ name: h.name, acc: a.name, id: h.id, v, ter, env: euro ? a.feeEuro : a.feeUC, cost: f + e });
  }
  if (!a.hs.length && a.feeUC) envF += a.value * a.feeUC / 100;
  return { fund, env: envF, total: fund + envF, unknown, lines, known: a.feeUC != null || a.hs.some((h) => h.ter != null) };
}
function feesTable(P) {
  const rows = P.accRows.filter((a) => isInvestType(a.type) && a.value > 0).map((a) => ({ a, f: feesOf(a) })).filter((x) => x.f.known).sort((x, y) => y.f.total - x.f.total);
  if (!rows.length) return "";
  const tot = rows.reduce((s, x) => s + x.f.total, 0), base = rows.reduce((s, x) => s + x.a.value, 0), rate = base ? tot / base : 0;
  const yrs = 10, r = 0.05, lost = base * (Math.pow(1 + r, yrs) - Math.pow(1 + r - rate, yrs));
  const lines = rows.flatMap((x) => x.f.lines).filter((l) => l.v > 0 && l.cost > 0).sort((a, b) => b.cost / b.v - a.cost / a.v).slice(0, 5);
  const pc = (c, v) => fP(v ? (c / v) * 100 : 0, 2);
  return `<details class="section fold"><summary><span class="fold-t"><h2>Frais annuels</h2><span class="note">${pc(tot, base)} de tes placements par an</span></span><b>${fE(tot)}<small> /an</small></b></summary>
    <div class="panel kv"><div class="strong"><span>Coût total par an</span><span style="white-space:nowrap">${fE(tot)} · ${pc(tot, base)}</span></div>
      <div><span>Sur ${yrs} ans, à 5 %/an avant frais</span><span class="loss">≈ −${fE(lost)}</span></div>
      <div><span class="note">Manque à gagner sans nouveau versement : l'écart entre ton capital sans frais et avec frais au bout de ${yrs} ans.</span></div></div>
    <div class="panel list" style="margin-top:10px">${rows.map(({ a, f }) => `<button class="row" data-act="open-account" data-id="${a.id}"><span><div class="name">${esc(a.name)}</div>
      <div class="meta">fonds ${fE(f.fund)} · enveloppe ${fE(f.env)}${f.unknown ? ` · ${f.unknown} ligne${f.unknown > 1 ? "s" : ""} sans frais renseignés` : ""}${a.feeNote ? `<br>${esc(a.feeNote)}` : ""}</div></span>
      <span class="amt">${fE(f.total)}<small class="note">/an · ${pc(f.total, a.value)}</small></span></button>`).join("")}</div>
    ${lines.length ? `<div class="section-head" style="margin-top:14px"><h2 style="font-size:15px">Les lignes les plus chères</h2><span class="note">fonds + enveloppe, en %/an</span></div>
    <div class="panel list">${lines.map((l) => `<button class="row" data-act="edit-holding" data-id="${l.id}"><span><div class="name">${esc(l.name)}</div>
      <div class="meta">${esc(l.acc)} · fonds ${l.ter != null ? fP(l.ter, 2) : "?"} + enveloppe ${fP(l.env || 0, 2)}</div></span>
      <span class="amt">${pc(l.cost, l.v)}<small class="note">${fE(l.cost)} /an</small></span></button>`).join("")}</div>` : ""}
    <p class="note" style="margin-top:6px">Frais courants des fonds (prélevés dans leur cours, donc invisibles sur tes relevés) et frais de gestion de l'enveloppe. Les actions détenues en direct n'ont pas de frais courants ; le courtage et les frais d'entrée sont ponctuels et ne sont pas comptés ici.</p></details>`;
}
// performance depuis une valeur de départ connue (31/12), hors versements et retraits ; % rapporté au capital engagé (départ + versements)
function accountPerf(a) {
  if (a.startValue == null || !a.startDate) return null;
  const fl = S.flows.filter((f) => f.accountId === a.id && f.date > a.startDate);
  const net = fl.reduce((s, f) => s + (Number(f.amount) || 0), 0);
  const gain = a.value - a.startValue - net, base = a.startValue + fl.reduce((s, f) => s + Math.max(0, Number(f.amount) || 0), 0);
  return { gain, net, start: a.startValue, pct: base > 0 ? (gain / base) * 100 : null };
}
function ytdTable(P) {
  const rows = P.accRows.filter((a) => isInvestType(a.type)).map((a) => ({ a, r: accountPerf(a) })).filter((x) => x.r);
  if (!rows.length) return "";
  const missing = P.accRows.filter((a) => isInvestType(a.type) && a.value > 0 && a.startValue == null);
  const g = rows.reduce((s, x) => s + x.r.gain, 0);
  const start = rows.reduce((s, x) => s + x.r.start, 0), net = rows.reduce((s, x) => s + x.r.net, 0);
  const year = new Date(rows[0].a.startDate).getFullYear() + 1;
  return `<details class="section fold"><summary><span class="fold-t"><h2>Performance ${year} des placements</h2><span class="note">gain des marchés, hors versements</span></span><b class="${tone(g)}">${sg(g)}</b></summary>
    <div class="panel list">${rows.map(({ a, r }) => `<button class="row" data-act="open-account" data-id="${a.id}"><span><div class="name">${esc(a.name)}</div>
      <div class="meta">31/12 : ${fE(r.start)} · ${r.net >= 0 ? "versé" : "retiré"} ${fE(Math.abs(r.net))} · aujourd'hui ${fE(a.value)}</div></span>
      <span class="amt"><span class="${tone(r.gain)}">${sg(r.gain)}</span>${r.pct != null ? `<small class="${tone(r.gain)}">${r.pct >= 0 ? "+" : ""}${fP(r.pct, 1)}</small>` : ""}</span></button>`).join("")}
      <div class="row"><span><div class="name"><b>Total</b></div><div class="meta">départ ${fE(start)} · flux nets ${sg(net)}</div></span><span class="amt"><b class="${tone(g)}">${sg(g)}</b></span></div>
    </div>${missing.length ? `<p class="note" style="margin-top:6px">Sans valeur au 31/12 : ${missing.map((a) => esc(a.name)).join(", ")}.</p>` : ""}</details>`;
}
const sg = (v) => (v >= 0 ? "+" : "−") + fE(Math.abs(v));
// variation du net entre une photo et aujourd'hui, séparée entre marchés et épargne
function decomposition(P, firstSnap, rangeSnap) {
  const base = rangeSnap || firstSnap;
  if (!base || base.inv == null || base.assets == null || base.id === new Date().toISOString().slice(0, 10)) return null;
  const flows = S.flows.filter((f) => f.date > base.id).reduce((a, f) => a + (Number(f.amount) || 0), 0);
  const total = P.net - (base.assets - base.debts), market = P.inv - base.inv - flows;
  return { from: new Date(base.id).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }), total, market, saved: total - market, flows,
    marketPct: base.inv + flows / 2 > 0 ? (market / (base.inv + flows / 2)) * 100 : null };
}

const ENVELOPES = [
  { k: "all", label: "Tout" },
  { k: "cto", label: "CTO" },
  { k: "pea", label: "PEA" },
  { k: "assurance_vie", label: "Assurance-vie" },
  { k: "courant", label: "Compte courant" },
  { k: "livret", label: "Livrets" },
  { k: "epargne_salariale", label: "Épargne salariale" },
  { k: "per", label: "PER" },
  { k: "crypto", label: "Crypto" },
  { k: "autre", label: "Autre" },
];
const ALWAYS = ["all", "cto", "pea", "assurance_vie", "epargne_salariale", "courant", "livret"];
let env = "all";
let posSort = "perf";

function accountRow(a) {
  const pnl = a.hs.reduce((s, h) => s + h.qty * (h.price - h.pru), 0);
  const bits = [a.institution ? esc(a.institution) : "", a.updatedAt ? ago(a.updatedAt) : "", a.hs.length ? `${a.hs.length} ligne${a.hs.length > 1 ? "s" : ""}` : ""].filter(Boolean).join(" · ");
  const sl = (SLICES.find((x) => x.types.includes(a.type)) || { key: "autre" }).key;
  return `<button class="row with-av" data-act="open-account" data-id="${a.id}"><span class="av" style="--c:var(--c-${sl})">${esc((a.institution || a.name).trim().charAt(0).toUpperCase())}</span>
    <span><div class="name">${esc(a.name)}</div><div class="meta">${bits}</div></span>
    <span class="amt">${fE(a.value)}${a.hs.length ? `<small class="${tone(pnl)}">${pnl >= 0 ? "+" : "−"}${fE(Math.abs(pnl))}</small>` : ""}</span></button>`;
}
function holdingRows(list, showAccount) {
  return list.map((h) => {
    const v = h.qty * h.price, g = h.qty * (h.price - h.pru), gp = h.pru ? ((h.price - h.pru) / h.pru) * 100 : 0;

  }).join("");
}

function viewComptes(P) {

    body = groups.map((g) => `<section class="section"><div class="section-head"><h2>${g.l}</h2><span class="total">${fE(g.rows.reduce((s, a) => s + a.value, 0))}</span></div>
      <div class="panel list">${g.rows.map(accountRow).join("")}</div></section>`).join("") || `<div class="section"><div class="panel empty">Aucun compte pour l'instant.</div></div>`;
  } else {
    body = `

    <section class="section"><div class="section-head"><h2>${rows.length > 1 ? "Comptes" : "Compte"}</h2></div>
      <div class="panel list">${rows.map(accountRow).join("") || `<div class="empty">Aucun compte ${label} pour l'instant.</div>`}</div></section>
    ${isInvest && rows.length ? `<section class="section"><div class="section-head"><h2>Positions</h2>${rows.length === 1 ? `<button class="btn ghost sm" data-act="new-holding" data-id="${rows[0].id}">Ajouter</button>` : ""}</div>
      <div class="panel list">${holdingRows(hs.sort((a, b) => b.qty * b.price - a.qty * a.price), rows.length > 1) || `<div class="empty">Aucune position. Ouvre le compte pour en ajouter : le solde actuel reste compté en liquidités.</div>`}</div></section>` : ""}`;

  <section class="hero"><div class="eyebrow">${env === "all" ? "Comptes et placements" : label}</div><div class="big">${fE(total)}</div></section>

  ${body}
  <div class="section"><button class="btn add" data-act="new-account" ${env !== "all" ? `data-type="${env}"` : ""}>Ajouter ${env === "all" ? "un compte" : "un compte " + label}</button></div>`;

function viewPositions(P) {
  const all = P.accRows.flatMap((a) => a.hs.map((h) => ({ ...h, accName: a.name, accType: a.type })));
  // regroupe une même valeur détenue dans plusieurs enveloppes
  const map = new Map();
  for (const h of all) {
    const key = (h.ticker || h.name).trim().toUpperCase();
    const g = map.get(key) || { name: h.name, ticker: h.ticker, cls: h.cls, expo: h.expo, qty: 0, cost: 0, value: 0, lines: [] };
    g.qty += h.qty; g.cost += h.qty * h.pru; g.value += h.qty * h.price; g.lines.push(h);
    map.set(key, g);
  }
  const perfOf = (g) => (g.cost ? (g.value - g.cost) / g.cost : 0);
  const groups = [...map.values()].sort((a, b) => posSort === "perf" ? perfOf(b) - perfOf(a) || b.value - a.value : b.value - a.value);
  const total = groups.reduce((s, g) => s + g.value, 0), cost = groups.reduce((s, g) => s + g.cost, 0), pnl = total - cost;
  const byCls = {}; for (const g of groups) byCls[g.cls || "autre"] = (byCls[g.cls || "autre"] || 0) + g.value;
  if (!groups.length) return `
    <section class="hero"><div class="eyebrow">Positions en portefeuille</div><div class="big">${fE(0)}</div></section>
    <div class="panel empty">Aucune position pour l'instant. Tes comptes importés n'ont que leur solde.<br>Ouvre un PEA, un CTO ou une assurance-vie dans Comptes et ajoute tes lignes (quantité, PRU, cours).<br><button class="btn" data-tab="comptes">Aller aux comptes</button></div>`;
  return `
  <section class="hero"><div class="eyebrow">Positions en portefeuille</div><div class="big">${fE(total)}</div>
    <div class="sub"><span class="${tone(pnl)}">${pnl >= 0 ? "+" : "−"}${fE(Math.abs(pnl))} · ${fP(cost ? (pnl / cost) * 100 : 0)}</span> sur ${fE(cost)} investis</div></section>
  <div class="panel kv">${Object.entries(byCls).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div><span>${ASSET_CLASSES[k] || k}</span><span>${fE(v)} · ${fP((v / total) * 100, 1)}</span></div>`).join("")}</div>
  ${exposure(groups, total)}
  <section class="section"><div class="section-head"><h2>${groups.length} ligne${groups.length > 1 ? "s" : ""}</h2><span class="note">${posSort === "perf" ? "de la meilleure à la moins bonne" : "les plus grosses d'abord"}</span></div>
    <div class="seg" role="tablist" aria-label="Trier les positions" style="margin-bottom:10px">${[["perf", "Performance"], ["poids", "Poids"]].map(([k, l]) => `<button role="tab" class="seg-b" aria-selected="${posSort === k}" data-possort="${k}">${l}</button>`).join("")}</div>
    <div class="panel list">${groups.map((g, i) => {
      const gp = g.cost ? ((g.value - g.cost) / g.cost) * 100 : 0, pru = g.qty ? g.cost / g.qty : 0, w = total ? (g.value / total) * 100 : 0;
      const where = [...new Set(g.lines.map((l) => l.accName))].join(", ");
      const target = g.lines.length === 1 ? `data-act="edit-holding" data-id="${g.lines[0].id}"` : `data-act="open-account" data-id="${g.lines[0].accountId}"`;
      return `<button class="row" ${target}><span><div class="name">${posSort === "perf" ? `<span class="note" style="display:inline-block;min-width:1.6em">${i + 1}.</span>` : ""}${esc(g.name)}${g.ticker ? ` <span class="pill">${esc(g.ticker)}</span>` : ""}</div>
        <div class="meta">${esc(where)} · ${fQ(g.qty)} · PRU ${fU(pru)}</div>
        <div class="bar" style="margin-top:6px;max-width:160px"><i style="width:${w.toFixed(1)}%"></i></div></span>
        ${posSort === "perf"
          ? `<span class="amt"><span class="${tone(g.value - g.cost)}">${g.cost < g.value * 0.01 ? "offerte" : (gp > 0 ? "+" : "") + fP(gp, 1)}</span><small class="${tone(g.value - g.cost)}">${g.value >= g.cost ? "+" : "−"}${fE(Math.abs(g.value - g.cost))}</small><small class="note">${fE(g.value)} · ${fP(w, 1)}</small></span></button>`
          : `<span class="amt">${fE(g.value)}<small class="note">${fP(w, 1)}</small><small class="${tone(g.value - g.cost)}">${g.value >= g.cost ? "+" : "−"}${fE(Math.abs(g.value - g.cost))} · ${fP(gp, 1)}</small></span></button>`}`;
    }).join("")}</div></section>`;

// exposition réelle : chaque ligne porte sa répartition (expo.geo en %, expo.tech en %)
function exposure(groups, total) {
  const geo = {}; let tech = 0, known = 0;
  for (const g of groups) {
    if (!g.expo?.geo) { geo["Non renseigné"] = (geo["Non renseigné"] || 0) + g.value; continue; }
    known += g.value; tech += g.value * (g.expo.tech || 0) / 100;
    const sum = Object.values(g.expo.geo).reduce((a, b) => a + b, 0) || 100;
    for (const [k, v] of Object.entries(g.expo.geo)) geo[k] = (geo[k] || 0) + g.value * v / sum;
  }
  if (!known) return "";
  const rows = Object.entries(geo).sort((a, b) => b[1] - a[1]);
  const bar = (label, v, sub) => `<div style="display:grid;gap:4px"><div class="section-head"><span>${label}</span><span><b>${fP((v / total) * 100, 1)}</b> <span class="note">${sub}</span></span></div><div class="bar"><i style="width:${((v / total) * 100).toFixed(1)}%"></i></div></div>`;
  return `<section class="section"><div class="section-head"><h2>Exposition réelle</h2><span class="note">estimation, fonds et ETF regardés en transparence</span></div>
    <div class="panel" style="display:grid;gap:12px">${rows.map(([k, v]) => bar(esc(k), v, fE(v))).join("")}</div>
    <div class="panel" style="display:grid;gap:12px;margin-top:10px">${bar("Tech et télécoms", tech, fE(tech))}<p class="note">Part de tes placements dans la tech (logiciels, semi-conducteurs, internet, télécoms), toutes lignes confondues.</p></div></section>`;
}

function viewImmo(P) {

      <span class="amt">${fE(p.m.value)}${p.m.rent ? `<small class="${tone(p.m.netYield)}">${fP(p.m.netYield)} net</small>` : `<small class="note">${fE(p.m.debt)} dû</small>`}</span></button>`).join("") || `<div class="empty">Aucun bien pour l'instant.</div>`}</div>
  </section>
  <div class="section"><button class="btn add" data-act="new-property">Ajouter un bien</button></div>`;
}

/* ---------------- Fiches ---------------- */
function sheetAccount(a) {
  const pnl = a.hs.reduce((s, h) => s + h.qty * (h.price - h.pru), 0), inv = a.hs.reduce((s, h) => s + h.qty * h.pru, 0);

  impots: ["Impôts et taxes", "out", "#6b7487"], banque: ["Frais bancaires", "out", "#98a5ba"], autres: ["Autres dépenses", "out", "#8592a6"],

const BAUTO = [
  [/salaire|\bpaie\b|remuneration|payroll/, "salaire"],

  [/compte joint|vir.* (interne|de compte a compte)|halbaut|rochetti|revolut.*top|top.?up|alimentation compte/, "interne"],
  [/loyer|edf|engie|totalenergies (elec|gaz)|veolia|saur|eau de|syndic|foncia|nexity|assurance hab|maif|macif|matmut|axa/, "logement"],

  [/netflix|spotify|deezer|disney|canal\+?|prime video|amazon prime|apple\.com|icloud|google (one|storage|play)|youtube|free mobile|freebox|\bsfr\b|orange|bouygues|sosh|red by|chatgpt|openai|anthropic|claude\.ai/, "abos"],
  [/pharmacie|doctolib|medecin|docteur|dentiste|mutuelle|opticien|laboratoire|kine|hopital/, "sante"],
  [/cinema|ugc|pathe|fnac|steam|playstation|nintendo|airbnb|booking|hotel|ryanair|easyjet|air france|vueling|transavia|decathlon|basic.?fit|fitness|concert|ticketmaster/, "loisirs"],
  [/amazon|amzn|zalando|vinted|zara|h&m|uniqlo|primark|kiabi|sephora|nocibe|cdiscount|shein|apple store/, "shopping"],
  [/ikea|leroy merlin|castorama|brico|but\b|conforama|maisons du monde|action\b|gifi/, "maison"],
  [/dgfip|impot|tresor public|amende|antai/, "impots"],

const normL = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim();
function ruleKey(label) {
  return normL(label).replace(/[0-9]+/g, " ").replace(/[^a-z&+. ]/g, " ")
    .replace(/\b(cb|carte|prlv|prelevement|sepa|vir|virement|inst|instantane|paiement|achat|du|le|la|les|de|des|en|x|fr|paris|facture|recu|emis|ref)\b/g, " ")

function catOf(t) {
  if (t.cat && BCATS[t.cat]) return t.cat;

const isBudgetAcc = (a) => a.type === "courant" && !/trade republic/i.test(a.institution || "");

let bMonth = null, bScope = "all", bCat = null, bImport = null;
function budgetData() {
  const accs = R.accounts.filter(isBudgetAcc);

  const jointBal = accs.filter(isJointAcc).reduce((s, a) => s + (a.cash || 0), 0);
  const persoIds = new Set(perso.map((a) => a.id));
  const tx = R.tx.filter((t) => (t.accountId === "joint" ? bScope !== "perso" : persoIds.has(t.accountId) && bScope !== "joint"))

}
const accLabel = (id) => id === "joint" ? "Compte joint" : (() => { const a = R.accounts.find((x) => x.id === id); return a ? `${a.institution || a.name}${profile === "foyer" ? " · " + (PROFILES.find((p) => p.k === ownerOf(a))?.label || "") : ""}` : "Compte supprimé"; })();
const ym = (d) => String(d).slice(0, 7);
const monthName = (m, long = true) => new Date(m + "-15").toLocaleDateString("fr-FR", long ? { month: "long", year: "numeric" } : { month: "short" }).replace(".", "");
const shiftM = (m, k) => { const d = new Date(m + "-15"); d.setMonth(d.getMonth() + k); return d.toISOString().slice(0, 7); };
function monthTotals(tx) {

  for (const t of tx) by[t.c] = (by[t.c] || 0) + t.amount;
  const kindSum = (k) => Object.entries(by).filter(([c]) => BCATS[c][1] === k).reduce((s, [, v]) => s + v, 0);

function budgetBars(months) {
  const W = 320, H = 118, top = 8, base = H - 18, max = Math.max(1, ...months.flatMap((m) => [m.inc, m.out]));
  const gw = W / months.length, bw = Math.min(9, gw / 3.2);
  const bars = months.map((m, i) => {
    const x = i * gw + gw / 2, h1 = (Math.max(0, m.inc) / max) * (base - top), h2 = (Math.max(0, m.out) / max) * (base - top);
    return `<rect x="${(x - bw - 1).toFixed(1)}" y="${(base - h1).toFixed(1)}" width="${bw}" height="${h1.toFixed(1)}" rx="2" fill="var(--gold)"${m.cur ? "" : ' opacity=".55"'}/>` +
      `<rect x="${(x + 1).toFixed(1)}" y="${(base - h2).toFixed(1)}" width="${bw}" height="${h2.toFixed(1)}" rx="2" fill="var(--accent)"${m.cur ? "" : ' opacity=".55"'}/>` +
      `<text x="${x.toFixed(1)}" y="${H - 4}" text-anchor="middle"${m.cur ? ' style="fill:var(--fg);font-weight:600"' : ""}>${monthName(m.m, false).slice(0, 3)}</text>`;
  }).join("");

}
function viewBudget() {
  const D = budgetData();

  if (!bMonth) bMonth = months.length ? months[months.length - 1] : today;
  const cur = D.tx.filter((t) => ym(t.date) === bMonth), T = monthTotals(cur);
  const last12 = Array.from({ length: 12 }, (_, i) => shiftM(bMonth, i - 11));

    <div class="actions"><button class="btn" type="submit">Enregistrer</button>
      ${data && !data.__new ? `<button class="btn danger" type="button" data-act="delete" data-kind="${kind}" data-id="${data.id}">Supprimer</button>` : ""}</div>
  </form>`;
}

function readForm(form) {
  const kind = form.dataset.kind, fd = new FormData(form), o = {};
  for (const [, fs] of F[kind].groups) for (const [k, , type] of fs) {
    const v = fd.get(k);
    o[k] = type === "number" ? num(v) : String(v ?? "").trim();
  }
  if (kind === "property") { if (!o.value) o.value = o.price; if (!fd.get("share")) o.share = 100; }
  if (kind === "account") {
    for (const k of ["startValue", "deposits", "withdrawals", "feeUC", "feeEuro"]) if (!String(fd.get(k) ?? "").trim()) o[k] = null;
    if (o.startValue != null) o.startDate = `${new Date().getFullYear() - 1}-12-31`;
  }
  if (kind === "holding" && !o.price) o.price = o.pru;
  if (kind === "holding" && !String(fd.get("ter") ?? "").trim()) o.ter = null;
  if (kind === "loan") { o.months = Math.round(o.years * 12); delete o.years; }
  return o;
}

/* ---------------- Sauvegarde ---------------- */
async function save(col, id, data) {
  if (!db) throw new Error("La sauvegarde n'est pas disponible dans cette vue.");
  if (id) { const { id: _drop, ...old } = S[col].find((x) => x.id === id) || {}; await db.collection(col).doc(id).set({ ...old, ...data, updatedAt: new Date().toISOString() }); }
  else return (await db.collection(col).add({ ...data, ...(["accounts", "properties", "loans"].includes(col) && profile !== "foyer" && !data.profile ? { profile } : {}), createdAt: new Date().toISOString() })).id;
}
async function remove(kind, id) {
  const col = F[kind].col;
  await db.collection(col).doc(id).delete();
  if (kind === "account") for (const h of S.holdings.filter((h) => h.accountId === id)) await db.collection("holdings").doc(h.id).delete();
  if (kind === "property") for (const l of S.loans.filter((l) => l.propertyId === id)) await db.collection("loans").doc(l.id).delete();
}
let snapDone = false;
// une photo par jour et par profil (Nathan : AAAA-MM-JJ ; autres : profil_AAAA-MM-JJ)
async function snapshotToday() {
  if (snapDone || !db || !S.ready || !S.writable) return;
  snapDone = true;
  const day = new Date().toISOString().slice(0, 10), todo = [];
  for (const { k } of PROFILES) {
    applyProfile(k);
    const P = portfolio(); if (!P.assets && !P.debts) continue;
    const id = snapPrefix(k) + day, cur = R.snapshots.find((s) => s.id === id);
    if (cur && Math.round(cur.assets) === Math.round(P.assets) && Math.round(cur.debts) === Math.round(P.debts) && Math.round(cur.inv ?? -1) === Math.round(P.inv)) continue;
    todo.push([id, { assets: Math.round(P.assets), debts: Math.round(P.debts), inv: Math.round(P.inv), by: "page" }]);
  }
  applyProfile();
  for (const [id, d] of todo) { try { await db.collection("snapshots").doc(id).set(d); } catch { /* lecture seule */ } }
}

/* ---------------- Rendu ---------------- */
function eyeIcon() {
  const b = document.getElementById("eye"); if (!b) return;
  b.setAttribute("aria-pressed", String(discret));
  const t = discret ? "Afficher les montants" : "Masquer les montants"; b.title = t; b.setAttribute("aria-label", t);
  b.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/>${discret ? '<path d="M4 4l16 16"/>' : ""}</svg>`;
}
setTimeout(eyeIcon, 0);
const $ = (s) => document.querySelector(s);
function render() {
  applyProfile();
  const P = portfolio();
  const pb = document.getElementById("profiles");
  if (pb) pb.innerHTML = PROFILES.map((p) => `<button role="tab" class="prof" aria-selected="${p.k === profile}" data-profile="${p.k}"><span class="av-s">${p.k === "foyer" ? "∞" : p.label.charAt(0)}</span>${p.label}</button>`).join("");
  $("#view").innerHTML = tab === "comptes" ? viewComptes(P) : tab === "positions" ? viewPositions(P) : tab === "immobilier" ? viewImmo(P) : tab === "budget" ? viewBudget() : viewSynthese(P);
  document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-current", t.dataset.tab === tab ? "page" : "false"));
  if (sheet && sheet.live) openSheet(sheet, true);
  else if (pendingOpen) openPending();
}
function openSheet(s, refresh) {
  sheet = s;
  const P = portfolio();
  let html = "";
  if (s.type === "account") { const a = P.accRows.find((x) => x.id === s.id); if (!a) return closeSheet(); html = sheetAccount(a); }
  else if (s.type === "property") { const p = P.propRows.find((x) => x.id === s.id); if (!p) return closeSheet(); html = sheetProperty(p); }
  else html = s.html;
  const root = $("#sheet-root"), scroll = root.querySelector(".sheet")?.scrollTop || 0;
  root.innerHTML = `<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  if (refresh) root.querySelector(".sheet").scrollTop = scroll;
}
function closeSheet() { sheet = null; $("#sheet-root").innerHTML = ""; }
function openForm(kind, data, extra) {
  const back = sheet && sheet.live ? { ...sheet } : null;
  openSheet({ html: formHtml(kind, data, extra), back });
}
function goBack() { const b = sheet?.back; if (b) openSheet(b); else closeSheet(); }

function setTab(t) {
  tab = ["synthese", "comptes", "positions", "immobilier", "budget"].includes(t) ? t : "synthese";
  if (location.hash.slice(1) !== tab) { try { history.replaceState(null, "", "#" + tab); } catch {} }
  render(); window.scrollTo(0, 0);
}

document.addEventListener("click", async (e) => {
  const sb = e.target.closest("[data-env]"); if (sb) { env = sb.dataset.env; return render(); }
  const pf = e.target.closest("[data-profile]"); if (pf) { profile = pf.dataset.profile; try { localStorage.setItem("socle-profil", profile); } catch { } window.scrollTo(0, 0); return render(); }
  if (e.target.closest("#eye")) { discret = !discret; try { localStorage.setItem("socle-discret", discret ? "1" : "0"); } catch { } eyeIcon(); return render(); }
  const bm = e.target.closest("[data-bmonth]"); if (bm) { bMonth = shiftM(bMonth, Number(bm.dataset.bmonth)); bCat = null; return render(); }
  const bs = e.target.closest("[data-bscope]"); if (bs) { bScope = bs.dataset.bscope; bCat = null; return render(); }
  const bc = e.target.closest("[data-bcat]"); if (bc) { bCat = bCat === bc.dataset.bcat ? null : bc.dataset.bcat; render(); document.querySelector(".txr, .dayh")?.closest("section")?.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  const ps = e.target.closest("[data-possort]"); if (ps) { posSort = ps.dataset.possort; return render(); }
  const rg = e.target.closest("[data-range]"); if (rg) { histRange = rg.dataset.range; return render(); }
  const se = e.target.closest("[data-series]"); if (se) { histSeries = se.dataset.series; return render(); }
  const t = e.target.closest("[data-tab],[data-act]"); if (!t) return;
  if (t.dataset.tab) return setTab(t.dataset.tab);
  const id = t.dataset.id, act = t.dataset.act;
  const find = (col) => S[col].find((x) => x.id === id);
  if (act === "close") return sheet?.back ? goBack() : closeSheet();
  if (!S.writable && /^(new|edit)-|^monthly$|^tx-/.test(act)) return;
  if (act === "tx-new") return openSheet({ html: sheetTx(null) });
  if (act === "tx-edit") { const x = R.tx.find((y) => y.id === id); return x && openSheet({ html: sheetTx(x) }); }
  if (act === "tx-import") { bImport = null; return openSheet({ html: sheetImport() }); }
  if (act === "tx-import-run") return runImport(t);
  if (act === "open-account") openSheet({ type: "account", id, live: true });
  else if (act === "open-property") openSheet({ type: "property", id, live: true });
  else if (act === "monthly") openSheet({ html: sheetMonthly() });
  else if (act === "new-account") openForm("account", null, { type: t.dataset.type });
  else if (act === "edit-account") openForm("account", find("accounts"));
  else if (act === "new-holding") openForm("holding", null, { parent: id, crypto: find("accounts")?.type === "crypto" });
  else if (act === "edit-holding") openForm("holding", find("holdings"), { parent: find("holdings")?.accountId });
  else if (act === "new-property") openForm("property");
  else if (act === "edit-property" && t.dataset.focus === "__loan") openForm("loan", null, { parent: id });
  else if (act === "edit-property") { openForm("property", find("properties")); const f = t.dataset.focus && document.getElementById("f-property-" + t.dataset.focus); if (f) { f.scrollIntoView({ block: "center" }); f.focus(); } }
  else if (act === "new-loan") openForm("loan", null, { parent: id });
  else if (act === "new-flow") openForm("flow", { date: new Date().toISOString().slice(0, 10) , __new: 1 }, { parent: id });
  else if (act === "edit-flow") openForm("flow", find("flows"), { parent: find("flows")?.accountId });
  else if (act === "edit-loan") openForm("loan", find("loans"), { parent: find("loans")?.propertyId });
  else if (act === "delete") {
    if (t.dataset.confirm !== "1") { t.dataset.confirm = "1"; t.textContent = "Confirmer la suppression"; return; }
    t.disabled = true;
    try { await remove(t.dataset.kind, id); goBack(); }
    catch (err) { showErr(err); t.disabled = false; }
  }
});
document.addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target, kind = form.dataset.kind, id = form.dataset.id || null, parent = form.dataset.parent || null;
  if (kind === "monthly") return saveMonthly(form);
  if (kind === "tx") return saveTx(form);
  const data = readForm(form);
  if (kind === "holding") data.accountId = parent;
  if (kind === "loan") data.propertyId = parent;
  if (kind === "flow") data.accountId = parent;
  const old = id ? S[F[kind].col].find((x) => x.id === id) : null;
  if (old?.createdAt) data.createdAt = old.createdAt;
  const btn = form.querySelector("[type=submit]"); btn.disabled = true; btn.textContent = "Enregistrement…";
  try {
    const newId = await save(F[kind].col, id, data);
    const back = sheet?.back;
    if (newId && (kind === "account" || kind === "property")) { sheet = null; pendingOpen = { type: kind, id: newId, live: true }; openPending(); }
    else if (back) openSheet(back); else closeSheet();
  } catch (err) { showErr(err); btn.disabled = false; btn.textContent = "Enregistrer"; }
});
let pendingOpen = null;
// la nouvelle ligne arrive par le flux de données : on ouvre sa fiche dès qu'elle est là
function openPending() {
  if (!pendingOpen) return;
  const list = pendingOpen.type === "account" ? S.accounts : S.properties;
  if (list.some((x) => x.id === pendingOpen.id)) { const o = pendingOpen; pendingOpen = null; openSheet(o); }
  else closeSheet();
}
async function saveMonthly(form) {
  const btn = form.querySelector("[type=submit]"), now = new Date().toISOString();
  const changes = [...form.querySelectorAll("input[data-orig]")].filter((i) => Math.abs(num(i.value) - Number(i.dataset.orig)) > 0.004);
  if (!changes.length) return closeSheet();
  btn.disabled = true; btn.textContent = "Enregistrement…";
  const col = { acc: "accounts", h: "holdings", p: "properties" }, field = { acc: "cash", h: "price", p: "value" };
  try {
    for (const i of changes) {
      const [k, id] = i.name.split(":");
      await db.collection(col[k]).doc(id).update({ [field[k]]: num(i.value), updatedAt: now });
    }
    snapDone = false; closeSheet(); snapshotToday();
    $("#status").textContent = `${changes.length} valeur${changes.length > 1 ? "s" : ""} mise${changes.length > 1 ? "s" : ""} à jour`;
  } catch (err) { showErr(err); btn.disabled = false; btn.textContent = "Enregistrer les changements"; }
}
document.addEventListener("input", (e) => { const i = e.target; if (i.dataset?.orig !== undefined) i.classList.toggle("changed", Math.abs(num(i.value) - Number(i.dataset.orig)) > 0.004); });
function showErr(err) {
  const el = document.getElementById("form-err"); if (!el) return;
  el.hidden = false;
  el.textContent = err?.code === "quota_exceeded" ? "L'espace de sauvegarde est plein : supprime d'anciennes lignes puis réessaie." :
    err?.code === "invalid_argument" ? "Tu peux consulter ce Socle mais pas le modifier." : "Enregistrement impossible pour le moment. Réessaie dans un instant.";
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && sheet) closeSheet(); });
window.addEventListener("hashchange", () => setTab(location.hash.slice(1)));

/* ---------------- Démarrage ---------------- */
setTab(location.hash.slice(1));
(async () => {
  const status = $("#status");
  const timer = setTimeout(() => { if (!S.ready) status.textContent = "Données injoignables pour l'instant"; }, 10000);
  try { db = await window.claude?.use?.("db"); } catch { db = null; }
  if (!db) { clearTimeout(timer); status.textContent = "Ouvre Socle dans Claude pour voir tes données"; return; }
  try { const u = await window.claude.use("user"); if (u && (await u.can?.("data.write")) === false) S.writable = false; } catch {}
  const got = new Set();
  for (const col of COLS) {
    db.collection(col).onSnapshot((snap) => {
      R[col] = snap.docs.map((d) => ({ id: d.id, ...d.data() })); applyProfile();
      if (!snap.metadata.fromCache) got.add(col);
      if (got.size === COLS.length && !S.ready) { S.ready = true; clearTimeout(timer); status.textContent = S.writable ? "Enregistré dans Claude" : "Lecture seule"; snapshotToday(); }
      render();
    }, () => { clearTimeout(timer); status.textContent = "Données indisponibles"; });
  }
})();
</script>
